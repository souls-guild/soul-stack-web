        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '422': { $ref: '#/components/responses/Problem422' }
        '500': { $ref: '#/components/responses/Problem500' }

  /v1/souls/{sid}/soulprint:
    get:
      tags: [Soul]
      operationId: GetSoulprint
      summary: Последний полученный typed-SoulprintReport.
      description: |
        Permission: soul.list (тот же, что для GET /v1/souls/{sid};
        отдельная `soul.soulprint.read` не вводится — паттерн one-permission-
        per-read, rbac.md §Souls).
        Возвращает `typed_facts` (proto SoulprintFacts, ADR-018) +
        collected_at (Soul-side) + received_at (Keeper-side).
        404 not-found — Soul-а нет в реестре;
        410 soulprint-not-received — Soul есть, но SoulprintReport ни разу не
        приходил (`transport: ssh` без агента, либо только что онбординг).
      parameters:
