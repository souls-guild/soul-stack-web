      parameters:
        - $ref: '#/components/parameters/OffsetQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - name: status
          in: query
          required: false
          explode: true
          schema:
            type: array
            items:
              type: string
              enum: [pending, running, success, partial_failed, failed, cancelled]
          description: |
            Multi-value-фильтр по статусу push-прогона (повторяющийся
            `?status=`-параметр). Несколько значений объединяются через OR.
            Невалидное значение → 422.
        - name: ssh_provider
          in: query
          required: false
          schema:
            type: string
          description: Exact-match-фильтр по push_runs.ssh_provider.
      responses:
        '200':
          description: Страница push-прогонов.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushRunListReply'
        '400': { $ref: '#/components/responses/Problem400' }
