components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT по ADR-014 (claims iss/sub/iat/exp/roles/bootstrap_initial).
        Все /v1/* endpoints требуют валидный токен; bootstrap первого
        Архонта — keeper init administrative subcommand, не HTTP.

  parameters:
    AidPath:
      name: aid
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9._@-]{1,127}$'
      description: AID Архонта (naming-rules.md).
    IncarnationNamePath:
      name: name
      in: path
      required: true
      schema:
        type: string
      description: Имя incarnation (kebab-case).
    RoleNamePath:
      name: name
      in: path
      required: true
      schema:
        type: string
      description: Имя роли (kebab-case).
    ServiceNamePath:
      name: name
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9-]*$'
      description: Имя Service-а (kebab-case).
    OmenNamePath:
      name: name
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9-]{1,63}$'
      description: Имя Omen-а (kebab-case, 1..63).
    RiteIDPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
      description: Суррогатный id Rite-а.
    RiteOmenQuery:
      name: omen
      in: query
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9-]{1,63}$'
      description: Имя Omen-а — обязательный фильтр списка Rite-ов (augur.md §6).
    OracleNamePath:
      name: name
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9-]{1,63}$'
      description: Имя Vigil-а / Decree-а (kebab-case, 1..63).
    SidPath:
      name: sid
      in: path
      required: true
      schema:
        type: string
      description: |
        SID = FQDN хоста, URL-encoded в path-сегменте (точки допустимы без
        экранирования). См. operator-api.md → Conventions → ID в path.
    ChoirNamePath:
      name: choir
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9_-]*$'
      description: Имя Choir-а внутри инкарнации (kebab/snake, начинается с буквы, ADR-044).
    OffsetQuery:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
      description: Сдвиг от начала набора (default 0).
    LimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 1000
        default: 50
      description: Размер страницы (1..1000, default 50).
    PluginNamespacePath:
      name: namespace
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
      description: Namespace плагина (тип — cloud / ssh / mod).
    PluginNamePath:
      name: name
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
      description: Имя плагина (kebab-case, как в manifest.name).
    PluginRefPath:
      name: ref
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
      description: |
        Operator-asserted метка версии (tag-ref вида v1.2.3). Одиночный
        path-сегмент; branch-ref со слешем в MVP не поддерживается.
    SigilKeyIDPath:
      name: key_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9a-f]{64}$'
      description: id ключа подписи (SHA-256(SPKI), hex lowercase).

  responses:
    Problem400:
      description: Malformed request (синтаксис JSON, неверные query-params).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Problem401:
      description: Unauthenticated — JWT отсутствует, не валиден или истёк.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Problem403:
      description: Forbidden — RBAC-проверка не прошла.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Problem404:
      description: |
        Ресурс не существует (not-found, role-not-found — роли нет или AID
        не член роли).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Problem409:
      description: |
        Conflict (incarnation-locked, migration-failed, would-lock-out-cluster,
        incarnation-already-exists, operator-already-exists, soul-already-exists,
        bootstrap-token-active, role-already-exists, role-builtin).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Problem422:
      description: |
        Validation failed — семантическая ошибка (input не соответствует
        scenario input-схеме, profile params не соответствует profile_schema,
        невалидный AID, отсутствует allow_destroy).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Problem500:
      description: Internal error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Problem502:
      description: |
        Bad gateway — upstream-ресурс (внешний git, …) недоступен или вернул
        ошибку. Keeper исправен, проблема за его пределами.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [ok]
      required: [status]

    ReadinessStatus:
      type: object
      properties:
        status:
          type: string
          enum: [not_ready]
        checks:
          type: object
          additionalProperties: true
          description: Карта зависимость → статус (postgres/vault/...).
      required: [status]

    ProblemDetails:
      type: object
      description: |
        RFC 7807 Problem Details. Каталог стабильных URN-ов в поле type —
        docs/keeper/operator-api.md → Типы ошибок.
      properties:
        type:
          type: string
          format: uri
          description: |
            Стабильный URN ошибки для machine-parsing.
            Пример "https://soul-stack.io/errors/incarnation-locked".
        title:
          type: string
          description: Краткий заголовок (английский, фиксированный для каждого type).
        status:
          type: integer
          format: int32
          description: HTTP status code (дублируется для удобства клиента).
        detail:
          type: string
          description: Человекочитаемое сообщение со значениями.
        instance:
          type: string
          format: uri
          description: URI запроса, который привёл к ошибке.
      required: [type, title, status]

    PaginationRequest:
      type: object
      description: |
        Query-params для list-эндпоинтов. В HTTP передаются как query (offset/limit),
        в MCP-tool input — как top-level поля. Schema присутствует для 1:1
        соответствия с proto/operator/v1/common.proto; ни одним $ref в этом
        документе не используется (HTTP path-операции используют отдельные
        OffsetQuery/LimitQuery parameters).
      properties:
        offset:
          type: integer
          format: int32
          minimum: 0
          default: 0
        limit:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000
          default: 50

    PaginationReply:
      type: object
      description: |
        Поля ответа list-эндпоинтов (без items). Schema присутствует для 1:1
        соответствия с proto/operator/v1/common.proto; *ListReply содержат
        offset/limit/total inline (плоская форма по PM-decision из proto-task).
      properties:
        offset:
          type: integer
          format: int32
        limit:
          type: integer
          format: int32
        total:
          type: integer
          format: int32
          description: Общее количество элементов с учётом фильтров.

    IncarnationStatus:
      type: string
      enum:
        - provisioning
        - ready
        - applying
        - error_locked
        - migration_failed
        - drift
        - destroying
        - destroy_failed
      description: |
        Статус runtime-инстанса. В proto константы имеют family-prefix
        (INCARNATION_STATUS_READY), в JSON API — короткие формы. `drift` —
        информационный статус Scry (ADR-031), НЕ блокирующий: remediation =
        обычный apply, который при успехе вернёт incarnation в `ready`.

    SoulTransport:
      type: string
      enum:
        - agent
        - ssh
      description: |
        Способ доставки конфигурации. agent — демон soul поверх mTLS gRPC stream;
        ssh — push без агента.

    SoulStatus:
      type: string
      enum:
        - pending
        - connected
        - disconnected
        - expired
      description: Статус Soul в реестре.

    OperatorCreateRequest:
      type: object
      properties:
        aid:
          type: string
          pattern: '^[a-z0-9][a-z0-9._@-]{1,127}$'
          description: AID нового Архонта (naming-rules.md).
        display_name:
          type: string
          description: Человекочитаемое имя для UI/аудита.
        roles:
          type: array
          items:
            type: string
            pattern: '^[a-z][a-z0-9-]*$'
          description: |
            Опциональный список ролей, которые надо приатачить новому Архонту
            в той же транзакции с INSERT operator-а (UX-fix: онбординг одним
            API-вызовом вместо двух — create + grant). Любая ошибка
            (несуществующая роль, FK-violation) → rollback, оператор НЕ
            создаётся. Пустой/опущенный — старое поведение без grant-ов.
            Идемпотентно: дубль в массиве — no-op (ON CONFLICT DO NOTHING).
      required: [aid, display_name]

    OperatorCreateReply:
      type: object
      description: |
        SENSITIVE: поле jwt отдаётся один раз; secret-masking middleware
        вырезает его из логов/OTel-spans/audit-trail.
      properties:
        aid:
          type: string
          pattern: '^[a-z0-9][a-z0-9._@-]{1,127}$'
        display_name:
          type: string
        created_at:
          type: string
          format: date-time
        created_by_aid:
          type: string
          pattern: '^[a-z0-9][a-z0-9._@-]{1,127}$'
          description: AID Архонта, выполнившего запрос (из JWT.sub).
        roles:
          type: array
          items:
            type: string
          description: |
            Actually-granted-роли (порядок входа). Пусто/опущено, если caller
            не передавал roles в запросе.
        jwt:
          type: string
          description: |
            SENSITIVE: never log. Выпущенный JWT, TTL = auth.jwt.ttl_default.
            Возвращается один раз — повторный выпуск только через issue-token.
      required: [aid, display_name, created_at, created_by_aid, jwt]

    Operator:
      type: object
      description: |
        Запись реестра operators (ADR-014). Возвращается /v1/operators (list) и
        /v1/operators/{aid} (detail). `bootstrap_initial` — derived-флаг
        (created_by_aid == null у первого Архонта через `keeper init`).
      properties:
        aid:
          type: string
          pattern: '^[a-z0-9][a-z0-9._@-]{1,127}$'
        display_name:
          type: string
        auth_method:
          type: string
          enum: [jwt, mtls, combined]
        created_at:
          type: string
          format: date-time
        created_by_aid:
          type: string
          pattern: '^[a-z0-9][a-z0-9._@-]{1,127}$'
          nullable: true
          description: null для первого bootstrap-Архонта (ADR-013).
        revoked_at:
          type: string
          format: date-time
          nullable: true
          description: null для активного Архонта.
        bootstrap_initial:
          type: boolean
          description: true — первый Архонт через `keeper init` (created_by_aid==null).
        metadata:
          type: object
          additionalProperties: true
      required: [aid, display_name, auth_method, created_at, bootstrap_initial]

    OperatorListReply:
      type: object
      description: |
        GET /v1/operators paged-list. items — Operator[]; offset/limit/total —
        стандартная сквозная пагинация (shared/api).
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Operator'
        offset:
          type: integer
        limit:
          type: integer
        total:
          type: integer
      required: [items, offset, limit, total]

    AuditEvent:
      type: object
      description: |
        Одна запись audit_log (ADR-022). Возвращается GET /v1/audit. payload —
        свободный jsonb, форма зависит от event_type; секреты маскируются на
        write-path (audit.MaskSecrets), read-path их НЕ декодирует обратно.
      properties:
        id:
          type: string
          description: ULID-26 (audit_log.audit_id).
        type:
          type: string
          description: '`<area>.<action>` (см. docs/naming-rules.md → Audit-events).'
        source:
          type: string
          enum: [signal, api, mcp, keeper_internal, soul_grpc, background]
        archon_aid:
          type: string
          pattern: '^[a-z0-9][a-z0-9._@-]{1,127}$'
          nullable: true
          description: AID инициатора (null для signal/keeper_internal/soul_grpc/background).
        correlation_id:
          type: string
          nullable: true
          description: ULID цепочки связанных событий (reuse apply_id для soul_grpc).
        created_at:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: true
      required: [id, type, source, created_at, payload]

    AuditEventListReply:
      type: object
      description: |
        GET /v1/audit paged-list. items — AuditEvent[]; offset/limit/total —
        стандартная сквозная пагинация.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        offset:
          type: integer
        limit:
          type: integer
        total:
          type: integer
      required: [items, offset, limit, total]

    OperatorRevokeRequest:
      type: object
      properties:
        aid:
          type: string
          pattern: '^[a-z0-9][a-z0-9._@-]{1,127}$'
          description: AID Архонта для отзыва (echo из path-param для MCP).
        reason:
          type: string
          description: Свободный текст причины для audit-trail (optional).

    OperatorRevokeReply:
      type: object
      description: |
        Для HTTP 204 No Content тело не пишется; для MCP-tool отдаётся
        structured-ответ с timestamp-ом. Schema присутствует для 1:1
        соответствия с proto/operator/v1/operator.proto (симметрия HTTP↔MCP).
      properties:
        revoked_at:
          type: string
          format: date-time
          description: Время установки operators.revoked_at.

    IssueTokenRequest:
      type: object
      description: |
        Body запроса пустой; AID цели — в path-param URL. TTL берётся
        из auth.jwt.ttl_default. Schema присутствует для 1:1 соответствия
        с proto/operator/v1/operator.proto.
      properties:
        aid:
          type: string
          pattern: '^[a-z0-9][a-z0-9._@-]{1,127}$'
          description: AID Архонта (echo из path-param для MCP).

    IssueTokenReply:
      type: object
      description: |
        SENSITIVE: поле jwt отдаётся один раз, masking-правила те же,
        что для OperatorCreateReply.jwt.
      properties:
        aid:
          type: string
          pattern: '^[a-z0-9][a-z0-9._@-]{1,127}$'
        jwt:
          type: string
          description: |
            SENSITIVE: never log. Новый JWT, TTL = auth.jwt.ttl_default.
        expires_at:
          type: string
          format: date-time
      required: [aid, jwt, expires_at]

    RoleCreateRequest:
      type: object
      properties:
        name:
          type: string
          description: Имя роли (kebab-case), уникальное в кластере.
        description:
          type: string
          description: Человекочитаемое описание роли для UI/аудита.
        permissions:
          type: array
          items:
            type: string
          description: |
            Набор permission-строк роли (например "incarnation.run",
            "soul.*", "*"). Валидируются rbac.ParsePermission; битый
            permission → 422 validation-failed.
      required: [name]

    RoleView:
      type: object
      description: |
        Проекция роли: метаданные, набор permissions и состав операторов
        (membership). Возвращается в RoleListReply.items[].
      properties:
        name:
          type: string
        description:
          type: string
        builtin:
          type: boolean
          description: |
            true — builtin-роль (cluster-admin и т.п.): не удаляется и не
            редактируется (409 role-builtin).
        permissions:
          type: array
          items:
            type: string
          description: Permission-строки роли (пустой массив, если их нет).
        operators:
          type: array
          items:
            type: string
            pattern: '^[a-z0-9][a-z0-9._@-]{1,127}$'
          description: AID операторов — членов роли (пустой массив, если их нет).
      required: [name, builtin, permissions, operators]

    RoleListReply:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RoleView'
      required: [items]

    RolePermissionsUpdateRequest:
      type: object
      description: |
        Replace-семантика: переданный набор полностью заменяет существующий
        набор permissions роли.
      properties:
        permissions:
          type: array
          items:
            type: string
          description: |
            Новый полный набор permission-строк. Битый permission →
            422 validation-failed.
      required: [permissions]

    GrantOperatorRequest:
      type: object
      properties:
        aid:
          type: string
          pattern: '^[a-z0-9][a-z0-9._@-]{1,127}$'
          description: AID оператора, назначаемого в роль (naming-rules.md).
      required: [aid]

    ServiceRegisterRequest:
      type: object
      description: |
        Регистрация Service-а в реестре service_registry. name+git+ref
        обязательны; refresh опционален (duration авто-refresh, '5m').
      properties:
        name:
          type: string
          pattern: '^[a-z][a-z0-9-]*$'
          description: Имя Service-а (kebab-case).
        git:
          type: string
          description: git-источник service-репо (URL; не секрет).
        ref:
          type: string
          description: git ref (tag/branch) — версия Service-а (ADR-007).
        refresh:
          type: string
          description: Опц. duration авто-refresh ('5m'); опущено — без авто-refresh.
      required: [name, git, ref]

    ServiceUpdateRequest:
      type: object
      description: |
        Replace-семантика mutable-полей записи Service-а (git/ref/refresh).
        name — path-параметр (ключ записи), здесь не передаётся.
      properties:
        git:
          type: string
          description: Новый git-источник.
        ref:
          type: string
          description: Новый git ref.
        refresh:
          type: string
          description: Опц. duration авто-refresh ('5m').
      required: [git, ref]

    ServiceView:
      type: object
      description: |
        Проекция записи реестра service_registry: имя + git/ref/refresh +
        audit-метаданные. Возвращается в ServiceListReply.items[] и из
        register/get/update.
      properties:
        name:
          type: string
        git:
          type: string
        ref:
          type: string
        refresh:
          type: string
          description: duration авто-refresh; отсутствует, если не задан.
        created_by_aid:
          type: string
          pattern: '^[a-z0-9][a-z0-9._@-]{1,127}$'
          description: AID создателя; отсутствует у seed/системных записей.
        updated_by_aid:
          type: string
          pattern: '^[a-z0-9][a-z0-9._@-]{1,127}$'
          description: AID последнего правщика; отсутствует, если не задан.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [name, git, ref, created_at, updated_at]

    ServiceListReply:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ServiceView'
      required: [items]

    GitRef:
      type: object
      description: |
        Одна запись git-ref-листинга remote-репозитория Service-а (tag либо
        branch). Используется в UI Upgrade-modal dropdown.
      properties:
        name:
          type: string
          description: Голое имя ref-а ('v2.0.0' / 'main'), без 'refs/'-префикса.
        type:
          type: string
          enum: [tag, branch]
          description: Тип ref-а.
        commit:
          type: string
          description: Полный sha1 commit-а, на который указывает ref.
        is_default:
          type: boolean
          description: |
            true только для дефолтной ветки remote-а (HEAD-symref) или для
            main/master при fallback-е, если HEAD-symref не получен. У tag-ов
            всегда отсутствует/false.
      required: [name, type, commit]

    ServiceRefsListReply:
      type: object
      description: |
        Ответ `GET /v1/services/{name}/refs`: список git-tag-ов + branch-ей
        remote-репозитория Service-а. Сортировка: tags — semver desc (валидный
        semver выше lex; pre-release ниже release), затем branches — default
        first, остальные lex asc.
      properties:
        service:
          type: string
          description: Имя Service-а (дубль path-параметра для удобства клиента).
        refs:
          type: array
          items:
            $ref: '#/components/schemas/GitRef'
      required: [service, refs]

    Scenario:
      type: object
      description: |
        Метаданные одного scenario из материализованного снапшота git-репо
        Service-а (`scenario/<name>/main.yml`). Лёгкая проекция top-level полей
        scenario.yml для UI dropdown «Choose scenario» — handler-у не нужны ни
        tasks, ни state_changes, ни orchestration-дельта. Имя берётся из имени
        директории, не из top-level `name:` (директория — надёжный источник).
      properties:
        name:
          type: string
          description: Имя scenario (имя поддиректории `scenario/<name>/`).
        path:
          type: string
          description: |
            Относительный путь к main.yml внутри снапшота
            (`scenario/<name>/main.yml`).
        kind:
          type: string
          enum: [lifecycle, operational]
          description: |
            Дискриминатор сценария для UI (каталог, не хардкод имён):
            `lifecycle` — keeper трактует его особо (create / destroy /
            converge — bootstrap / teardown / drift-detect), `operational` —
            обычная операция над state. Размечается keeper-ом по имени, фронт
            читает поле, а не зашивает список lifecycle-имён.
        description:
          type: string
          description: top-level `description:` scenario (если задан).
        input_schema:
          type: object
          additionalProperties: true
          description: |
            top-level `input_schema:` (нормативное имя) или `input:` (fallback)
            scenario, в исходной YAML-форме. UI рендерит из этого форму ввода.
        tags:
          type: array
          items: { type: string }
          description: top-level `tags:` scenario (если заданы).
      required: [name, path, kind]

    ServiceScenariosListReply:
      type: object
      description: |
        Ответ `GET /v1/services/{name}/scenarios`: список scenario из git-репо
        Service-а на конкретном ref-е. Сортировка scenarios — alphabetical asc.
        Невалидный YAML / отсутствующий main.yml в одной из scenario-папок не
        ломает listing остальных (partial-success).
      properties:
        service:
          type: string
          description: Имя Service-а (дубль path-параметра).
        ref:
          type: string
          description: |
            git-ref, на котором составлен listing (значение query-параметра
            либо ref из реестра Service-а, если query не задан).
        scenarios:
          type: array
          items:
            $ref: '#/components/schemas/Scenario'
      required: [service, ref, scenarios]

    StateSchemaMigration:
      type: object
      description: |
        Одна запись цепочки state_schema-миграций (metadata-only): номера
        версий-источника и -приёмника + относительный путь файла в снапшоте.
        Content (DSL-операции) НЕ парсится — UI Schema explorer-у нужен только
        граф `from → to` (грамматику миграции пользователь смотрит в git-репо).
      properties:
        from:
          type: integer
          description: Версия-источник миграции (`<NNN>` в имени файла).
        to:
          type: integer
          description: Версия-приёмник миграции (`<MMM>` в имени файла).
        path:
          type: string
          description: |
            Относительный путь файла миграции внутри снапшота
            (`migrations/<NNN>_to_<MMM>.yml`).
      required: [from, to, path]

    ServiceStateSchemaReply:
      type: object
      description: |
        Ответ `GET /v1/services/{name}/state-schema`: state_schema-метаданные
        сервиса на конкретном ref-е. `state_schema_version` — текущая версия
        структуры `incarnation.state` (monotonic int, ADR-019); `schema` —
        опциональная декларация структуры из `service.yml::state_schema:`
        (MVP подмножество JSON Schema; отсутствует — UI трактует как
        «структура не задекларирована»); `migrations` — плоский список
        миграций в `migrations/<NNN>_to_<MMM>.yml`, отсортированный по `to`
        ASC. Content миграций не парсится — только metadata.
      properties:
        service:
          type: string
          description: Имя Service-а (дубль path-параметра).
        ref:
          type: string
          description: |
            git-ref, на котором составлен listing (значение query-параметра
            либо ref из реестра Service-а, если query не задан).
        state_schema_version:
          type: integer
          description: Текущая версия структуры `incarnation.state` (≥1).
        schema:
          type: object
          additionalProperties: true
          description: |
            Декларация структуры state из `service.yml::state_schema:`
            (MVP подмножество JSON Schema draft-07: type / required /
            properties / items / additionalProperties). Может отсутствовать.
        migrations:
          type: array
          items:
            $ref: '#/components/schemas/StateSchemaMigration'
          description: |
            Найденные шаги цепочки миграций (metadata-only), sorted by `to` ASC.
      required: [service, ref, state_schema_version, migrations]

    ServiceDependency:
      type: object
      description: |
        Одна запись `destiny[]` / `modules[]` манифеста `service.yml`
        (metadata-only): имя зависимости и её git-ref (ADR-007: версия = git
        tag/branch). Content самой destiny/модуля не парсится.
      properties:
        name:
          type: string
          description: |
            Имя зависимости: kebab-case destiny (`redis`) или двухуровневый
            `<namespace>.<module>` для custom-модуля (`wb.redis-failover`).
        ref:
          type: string
          description: git-ref зависимости (tag или branch, ADR-007).
        git:
          type: string
          description: |
            Опц. per-entry override полного git-URL зависимости. Присутствует
            только если задан в манифесте (поддержан лишь для destiny[]).
      required: [name, ref]

    ServiceDependenciesReply:
      type: object
      description: |
        Ответ `GET /v1/services/{name}/dependencies`: git-зависимости сервиса
        на конкретном ref-е. `destiny` / `modules` — задекларированные в
        `service.yml` блоки `destiny:` / `modules:` (каждая запись со своим
        git-ref-ом). Оба массива non-nil (сервис без зависимостей валиден →
        `[]`, не null).
      properties:
        service:
          type: string
          description: Имя Service-а (дубль path-параметра).
        ref:
          type: string
          description: |
            git-ref, на котором составлен listing (значение query-параметра
            либо ref из реестра Service-а, если query не задан).
        destiny:
          type: array
          items:
            $ref: '#/components/schemas/ServiceDependency'
          description: destiny-кирпичики из `service.yml::destiny:`.
        modules:
          type: array
          items:
            $ref: '#/components/schemas/ServiceDependency'
          description: custom-модули из `service.yml::modules:`.
      required: [service, ref, destiny, modules]

    OmenCreateRequest:
      type: object
      description: |
        Создание Omen-а (внешняя система Augur). Master-credential НЕ передаётся —
        только auth_ref (vault-ref на него, augur.md §4.1).
      properties:
        name:
          type: string
          pattern: '^[a-z0-9-]{1,63}$'
          description: Имя Omen-а (kebab-case, 1..63).
        source_type:
          type: string
          enum: [vault, prometheus, elk]
          description: Тип внешней системы.
        endpoint:
          type: string
          description: URL внешней системы (не секрет).
        auth_ref:
          type: string
          pattern: '^vault:'
          description: vault-ref на master-credential (vault:<mount>/<path>).
      required: [name, source_type, endpoint, auth_ref]

    OmenView:
      type: object
      description: |
        Проекция записи реестра omens: имя + source_type/endpoint/auth_ref +
        audit-метаданные. Возвращается из create/get и в OmenListReply.items[].
      properties:
        name:
          type: string
        source_type:
          type: string
          enum: [vault, prometheus, elk]
        endpoint:
          type: string
        auth_ref:
          type: string
          description: vault-ref на master-cred; сам секрет не возвращается.
        created_by_aid:
          type: string
          pattern: '^[a-z0-9][a-z0-9._@-]{1,127}$'
          description: AID создателя; отсутствует у системных записей.
        created_at:
          type: string
          format: date-time
      required: [name, source_type, endpoint, auth_ref, created_at]

    OmenListReply:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OmenView'
        offset:
          type: integer
          format: int32
        limit:
          type: integer
          format: int32
        total:
          type: integer
          format: int32
      required: [items, offset, limit, total]

    RiteCreateRequest:
      type: object
      description: |
        Создание Rite-а (grant). Субъект — XOR coven/sid. allow — объект, форма
        зависит от source_type Omen-а (vault {paths?,policies?} / prometheus
        {queries} / elk {indices}, augur.md §4.2). token_ttl/token_num_uses —
        только vault-delegate.
      properties:
        omen:
          type: string
          pattern: '^[a-z0-9-]{1,63}$'
          description: Omen, к которому относится grant.
        coven:
          type: string
          description: Субъект-grant по Coven-метке (XOR с sid).
        sid:
          type: string
          description: Субъект-grant по конкретному SID (XOR с coven).
        allow:
          type: object
          description: Allow-list; форма по source_type Omen-а.
        delegate:
          type: boolean
          description: false — брокер (MVP-1); true — делегация (MVP-2).
        token_ttl:
          type: string
          description: TTL минтуемого scoped-токена; только vault-delegate.
        token_num_uses:
          type: integer
          minimum: 0
          description: Лимит использований токена; только vault-delegate.
      required: [omen, allow]

    RiteView:
      type: object
      description: |
        Проекция записи реестра rites: id + omen + субъект + allow + delegate +
        token-поля + audit-метаданные.
      properties:
        id:
          type: integer
          format: int64
        omen:
          type: string
        coven:
          type: string
        sid:
          type: string
        allow:
          type: object
        delegate:
          type: boolean
        token_ttl:
          type: string
        token_num_uses:
          type: integer
        created_by_aid:
          type: string
          pattern: '^[a-z0-9][a-z0-9._@-]{1,127}$'
        created_at:
          type: string
          format: date-time
      required: [id, omen, allow, delegate, created_at]

    RiteListReply:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RiteView'
      required: [items]

    VigilCreateRequest:
      type: object
      description: |
        Создание Vigil-а (Soul-side проверка beacons). Субъект — XOR coven/sid.
        params — объект, форма зависит от check (path / service-name / порог);
        typed-схема отложена (ADR-030). enabled опц. (опущено → true).
      properties:
        name:
          type: string
          pattern: '^[a-z0-9-]{1,63}$'
          description: Имя Vigil-а (kebab-case, 1..63).
        coven:
          type: array
          items:
            type: string
          description: Субъект-метки coven (XOR с sid).
        sid:
          type: string
          description: Субъект — один конкретный SID (XOR с coven).
        interval:
          type: string
          description: Частота проверки (duration-конвенция, напр. '30s').
        check:
          type: string
          description: Адрес core-beacon (напр. 'core.beacon.file_changed').
        params:
          type: object
          description: Параметры проверки; форма зависит от check.
        enabled:
          type: boolean
          description: Активна ли проверка. По умолчанию true.
      required: [name, interval, check]

    VigilView:
      type: object
      description: |
        Проекция записи реестра vigils: имя + субъект + interval/check/params +
        enabled + audit-метаданные. Возвращается из create/get и в
        VigilListReply.items[].
      properties:
        name:
          type: string
        coven:
          type: array
          items:
            type: string
        sid:
          type: string
        interval:
          type: string
        check:
          type: string
        params:
          type: object
        enabled:
          type: boolean
        created_by_aid:
          type: string
          pattern: '^[a-z0-9][a-z0-9._@-]{1,127}$'
          description: AID создателя; отсутствует у системных записей.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [name, interval, check, params, enabled, created_at, updated_at]

    VigilListReply:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VigilView'
        offset:
          type: integer
          format: int32
        limit:
          type: integer
          format: int32
        total:
          type: integer
          format: int32
      required: [items, offset, limit, total]

    DecreeCreateRequest:
      type: object
      description: |
        Создание Decree-а (правило reactor). Субъект — XOR coven/sid.
        incarnation_name обязательно (ServiceRef резолвится из неё; ADR-030).
        where — опц. CEL-предикат над event.data (compile-проверяется на create).
        action_scenario — named scenario (whitelist). enabled опц. (опущено → true).
      properties:
        name:
          type: string
          pattern: '^[a-z0-9-]{1,63}$'
          description: Имя Decree-а (kebab-case, 1..63).
        on_beacon:
          type: string
          pattern: '^[a-z0-9-]{1,63}$'
          description: Имя Vigil-а, на чей Portent правило реагирует.
        where:
          type: string
          description: Опц. CEL-предикат над event.data; compile-проверяется.
        coven:
          type: array
          items:
            type: string
          description: Субъект-метки coven (XOR с sid).
        sid:
          type: string
          description: Субъект — один конкретный SID (XOR с coven).
        incarnation_name:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
          description: Таргет-incarnation реакции (обязательно).
        action_scenario:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          description: Named scenario (whitelist; raw-команда отвергнута).
        action_input:
          type: object
          description: Вход сценария (vault-ref едет как есть).
        cooldown:
          type: string
          description: Минимальный интервал между срабатываниями per-(decree, subject).
        enabled:
          type: boolean
          description: Активно ли правило. По умолчанию true.
      required: [name, on_beacon, incarnation_name, action_scenario]

    DecreeView:
      type: object
      description: |
        Проекция записи реестра decrees: имя + on_beacon + субъект +
        incarnation_name + action_scenario/action_input + where/cooldown +
        enabled + audit-метаданные.
      properties:
        name:
          type: string
        on_beacon:
          type: string
        where:
          type: string
        coven:
          type: array
          items:
            type: string
        sid:
          type: string
        incarnation_name:
          type: string
        action_scenario:
          type: string
        action_input:
          type: object
        cooldown:
          type: string
        enabled:
          type: boolean
        created_by_aid:
          type: string
          pattern: '^[a-z0-9][a-z0-9._@-]{1,127}$'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [name, on_beacon, incarnation_name, action_scenario, action_input, cooldown, enabled, created_at, updated_at]

    DecreeListReply:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DecreeView'
        offset:
          type: integer
          format: int32
        limit:
          type: integer
          format: int32
        total:
          type: integer
          format: int32
      required: [items, offset, limit, total]

    PluginSigilAllowRequest:
      type: object
      description: |
        Допуск плагина в allow-list Sigil. Бинарь + manifest Keeper читает из
        кеша host-а по (namespace, name); хеш бинаря НЕ передаётся клиентом —
        Keeper считает его сам (вариант C). ref — operator-asserted метка.
      properties:
        namespace:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
          description: Namespace плагина (тип — cloud / ssh / mod).
        name:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
          description: Имя плагина (как в manifest.name).
        ref:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
          description: Operator-asserted метка версии (НЕ git-verified, tag-ref).
      required: [namespace, name, ref]

    PluginSigilAllowReply:
      type: object
      properties:
        namespace:
          type: string
        name:
          type: string
        ref:
          type: string
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 одобренного бинаря (hex lowercase), посчитанный Keeper-ом.
      required: [namespace, name, ref, sha256]

    PluginSigilView:
      type: object
      description: |
        Проекция активного допуска. БЕЗ signature и manifest (крипто-материал /
        крупный JSONB query/audit-слой).
      properties:
        namespace:
          type: string
        name:
          type: string
        ref:
          type: string
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        allowed_by_aid:
          type: string
          pattern: '^[a-z0-9][a-z0-9._@-]{1,127}$'
          description: AID Архонта, допустившего плагин.
        allowed_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
          nullable: true
          description: Время ревокации; null у активных записей.
      required: [namespace, name, ref, sha256, allowed_by_aid, allowed_at]

    PluginSigilListReply:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PluginSigilView'
      required: [items]

    ModuleParam:
      type: object
      description: |
        Один параметр модуля из manifest-схемы (`spec.states[*].input`): для
        plugin — из manifest.yaml, для core — из coremanifest-реестра. Поля
        enum/pattern/format/source/multiline/example описывают UI-форму модуля (ADR-045).
      properties:
        name:
          type: string
        type:
          type: string
          description: Тип значения (string/int/bool/list/map и синонимы input-DSL).
        required:
          type: boolean
        secret:
          type: boolean
          description: Значение приходит через vault-ref (manifest secret-флаг).
        description:
          type: string
        enum:
          type: array
          description: Допустимые значения поля (closed-set).
          items: {}
        pattern:
          type: string
          description: Regex-ограничение значения.
        format:
          type: string
          description: Семантический формат строки (hostname/fqdn/ipv4/.../sid).
        source:
          $ref: '#/components/schemas/ModuleInputSource'
        multiline:
          type: boolean
          description: Поле = большое textarea (а не однострочный input).
        example:
          type: string
          description: Пример значения для placeholder UI-формы.
        items:
          allOf:
            - $ref: '#/components/schemas/ModuleParam'
          description: >-
            Описатель типа коллекции (ADR-045 S7 + amend). Для type=list/array —
            тип ЭЛЕМЕНТА (строит типизированный список, напр. list[int]). Для
            type=map/object — тип ЗНАЧЕНИЯ (map[string]<items>): при скалярном
            items.type UI рисует KEY→VALUE-редактор (виджет по items.type), без
            items / при items.type=map|object — JSON-редактор. Присутствует
            только если задан в манифесте.
      required: [name, required]

    ModuleInputSource:
      type: object
      description: |
        Дискриминатор каталога-источника значений поля формы (ADR-044/ADR-045):
        ровно один активный под-ключ.
      properties:
        incarnation_hosts:
          type: boolean
          description: Все SID текущей инкарнации.
        choir:
          type: string
          description: SID-ы конкретной Choir-партии инкарнации.

    ModuleCatalogItem:
      type: object
      description: |
        Запись каталога модулей. name — полное имя без state-суффикса
        (`core.cmd` / `official.postgres-user`). kind — core | plugin.
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [core, plugin]
        namespace:
          type: string
          description: namespace plugin-модуля; пусто у core.
        description:
          type: string
        states:
          type: array
          items: { type: string }
          description: Допустимые state-/verb-суффиксы (полный адрес — `<name>.<state>`).
        errand_safe:
          type: boolean
          description: |
            Хотя бы один state модуля безопасен к ad-hoc-вызову через Errand
            (ADR-033). Для фильтра `?errand_safe=true` в Run→Command.
        params:
          type: array
          items:
            $ref: '#/components/schemas/ModuleParam'
          description: Параметры (из manifest для plugin; пусто для core).
      required: [name, kind, states, errand_safe, params]

    ModuleCatalogReply:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ModuleCatalogItem'
      required: [items]

    PermissionAction:
      type: object
      description: |
        Один action в составе resource. selector_keys — ОБЩИЙ список допустимых
        ключей скоупа (per-permission-метаданных в каталоге MVP нет).
      properties:
        action:
          type: string
          description: Action permission-а (`<resource>.<action>`, может содержать дефис — `ssh-target-update`).
        selector_keys:
          type: array
          items: { type: string }
          description: Общий список допустимых ключей скоупа (service / coven / incarnation / host).
      required: [action, selector_keys]

    PermissionCatalogItem:
      type: object
      description: Группа actions одного resource в каталоге RBAC-permissions.
      properties:
        resource:
          type: string
          description: Resource permission-а (`<resource>.<action>`).
        actions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionAction'
      required: [resource, actions]

    PermissionCatalogReply:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PermissionCatalogItem'
      required: [items]

    SigilKeyIntroduceRequest:
      type: object
      description: |
        Ввод нового ключа подписи Sigil. Тело опционально (пустое = make_primary
        false). Keypair генерируется Keeper-ом, клиент его НЕ передаёт.
      properties:
        make_primary:
          type: boolean
          default: false
          description: Сделать новый ключ primary (новые Sigil-ы подписываются им).

    SigilKeyIntroduceReply:
      type: object
      description: |
        Результат ввода ключа. БЕЗ приватника (он в Vault; security-инвариант
        ADR-026(d)).
      properties:
        key_id:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Стабильный id ключа (SHA-256(SPKI), hex).
        pubkey_pem:
          type: string
          description: Публичная часть (SPKI PEM).
        is_primary:
          type: boolean
        status:
          type: string
          enum: [active, retired]
        introduced_at:
          type: string
          format: date-time
      required: [key_id, pubkey_pem, is_primary, status, introduced_at]

    SigilKeyView:
      type: object
      description: Проекция active-ключа подписи. БЕЗ vault_ref.
      properties:
        key_id:
          type: string
          pattern: '^[0-9a-f]{64}$'
        is_primary:
          type: boolean
        status:
          type: string
          enum: [active, retired]
        introduced_at:
          type: string
          format: date-time
      required: [key_id, is_primary, status, introduced_at]

    SigilKeyListReply:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SigilKeyView'
      required: [items]

    IncarnationCreateRequest:
      type: object
      properties:
        name:
          type: string
          description: Имя нового instance (kebab-case), корневая Coven-метка.
        service:
          type: string
          description: Имя сервиса из keeper.yml services.
        covens:
          type: array
          items:
            type: string
            pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
          description: >-
            Declared environment-теги incarnation (ADR-008 amendment a).
            Опциональны (по умолчанию пустой массив). Несут RBAC coven-scope
            incarnation-операций: эффективный scope = covens ∪ {name}.
            Coven-scoped оператор не может создать incarnation с тегом вне
            своего scope.
        input:
          type: object
          additionalProperties: true
          description: Input для scenario create. По умолчанию пустой объект.
      required: [name, service]

    IncarnationCreateReply:
      type: object
      properties:
        apply_id:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
          description: ULID запуска.
        incarnation:
          type: string
          description: Имя созданного instance (echo).
      required: [apply_id, incarnation]

    IncarnationRunRequest:
      type: object
      properties:
        name:
          type: string
          description: Имя instance (echo из path-param).
        scenario:
          type: string
          description: Имя сценария (echo из path-param).
        input:
          type: object
          additionalProperties: true
          description: Input scenario.
    IncarnationRunReply:
      type: object
      description: Classic single-run reply (без `wave`-поля).
      properties:
        apply_id:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        incarnation:
          type: string
        scenario:
          type: string
      required: [apply_id, incarnation, scenario]

    IncarnationGetReply:
      type: object
      properties:
        name:
          type: string
        service:
          type: string
        service_version:
          type: string
          description: Пин-версия сервиса (git-ref).
        state_schema_version:
          type: integer
          format: int32
          description: Версия state_schema (ADR-019).
        covens:
          type: array
          items:
            type: string
            pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
          description: >-
            Declared environment-теги incarnation (ADR-008 amendment a).
            Источник RBAC coven-scope (covens ∪ {name}). Всегда массив (пустой,
            если тегов нет).
        spec:
          type: object
          additionalProperties: true
          description: jsonb — то, что задекларировал оператор.
        state:
          type: object
          additionalProperties: true
          description: jsonb — текущая структурированная конфигурация.
        status:
          $ref: '#/components/schemas/IncarnationStatus'
        status_details:
          type: object
          additionalProperties: true
          nullable: true
          description: Детали ошибки, если status локирующий.
        created_by_aid:
          type: string
          pattern: '^[a-z0-9][a-z0-9._@-]{1,127}$'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_drift_check_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            ADR-031 Slice C. Время завершения последнего dry_run-прогона
            converge (фон или on-demand из Slice B). Отсутствует, если
            incarnation ни разу не сканировалась.
        last_drift_summary:
          type: object
          nullable: true
          description: >-
            ADR-031 Slice C. Counts-агрегат последнего DriftReport.
            Отсутствует, если incarnation ни разу не сканировалась.
          properties:
            hosts_drifted:
              type: integer
              format: int32
            hosts_clean:
              type: integer
              format: int32
            hosts_unsupported:
              type: integer
              format: int32
            hosts_failed:
              type: integer
              format: int32
            total_hosts:
              type: integer
              format: int32
            scanned_at:
              type: string
              format: date-time
      required:
        - name
        - service
        - service_version
        - state_schema_version
        - covens
        - status
        - created_by_aid
        - created_at
        - updated_at

    IncarnationListReply:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/IncarnationGetReply'
        offset:
          type: integer
          format: int32
        limit:
          type: integer
          format: int32
        total:
          type: integer
          format: int32
      required: [items, offset, limit, total]

    IncarnationHistoryReply:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StateHistoryEntry'
        offset:
          type: integer
          format: int32
        limit:
          type: integer
          format: int32
        total:
          type: integer
          format: int32
      required: [items, offset, limit, total]

    StateHistoryEntry:
      type: object
      description: Запись state_history (architecture.md → state_history).
      properties:
        history_id:
          type: string
          description: PK записи, UUID.
        scenario:
          type: string
          description: |
            Имя сценария, приведшего к изменению ("migration" для шагов миграции).
        state_before:
          type: object
          additionalProperties: true
        state_after:
          type: object
          additionalProperties: true
        changed_by_aid:
          type: string
          pattern: '^[a-z0-9][a-z0-9._@-]{1,127}$'
        apply_id:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        created_at:
          type: string
          format: date-time
      required: [history_id, scenario, changed_by_aid, apply_id, created_at]

    IncarnationUnlockRequest:
      type: object
      properties:
        name:
          type: string
          description: Имя instance (echo из path-param).
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: |
            Свободный текст; пишется в state_history.metadata.unlock_reason.
      required: [reason]

    IncarnationUnlockReply:
      type: object
      properties:
        name:
          type: string
        previous_status:
          $ref: '#/components/schemas/IncarnationStatus'
        status:
          $ref: '#/components/schemas/IncarnationStatus'
        unlocked_by_aid:
          type: string
          pattern: '^[a-z0-9][a-z0-9._@-]{1,127}$'
        unlocked_at:
          type: string
          format: date-time
      required: [name, previous_status, status, unlocked_by_aid, unlocked_at]

    IncarnationUpgradeRequest:
      type: object
      properties:
        name:
          type: string
          description: Имя instance (echo из path-param).
        to_version:
          type: string
          description: Целевая версия сервиса (git-ref).
      required: [to_version]

    IncarnationUpgradeReply:
      type: object
      properties:
        apply_id:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
      required: [apply_id]

    IncarnationDestroyReply:
      type: object
      properties:
        apply_id:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
      required: [apply_id]

    IncarnationSpecHost:
      type: object
      description: |
        Одна запись declared `spec.hosts[]` (ADR-008). Source of truth для
        bootstrap-create + topology resolver-а (`soulprint.hosts[].role`).
      properties:
        sid:
          type: string
          pattern: '^[a-z0-9][a-z0-9.-]{0,253}$'
          description: SID хоста (FQDN), обязан существовать в реестре `souls`.
        role:
          type: string
          pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
          maxLength: 63
          description: |
            Declared-роль (kebab-case, 1..63 символа). Опциональна — ADR-008
            допускает null для хостов вне declared-spec. Operator-asserted
            строка; список не предопределён (master/replica — частые, но не
            исчерпывающие).
      required: [sid]

    IncarnationUpdateHostsRequest:
      type: object
      description: |
        Body PATCH /v1/incarnations/{name}/hosts. Три mode-семантики над
        declared `spec.hosts[]` (ADR-008): replace / append / remove.
      properties:
        hosts:
          type: array
          items:
            $ref: '#/components/schemas/IncarnationSpecHost'
          description: |
            Список hosts для применения mode-операции. Для `remove` `role`
            игнорируется (важен только `sid`). Пустой массив legitimate для
            `replace` (очистить declared-spec).
        mode:
          type: string
          enum: [replace, append, remove]
          description: |
            Тип операции над existing `spec.hosts[]`. `replace` — полная замена;
            `append` — insert-or-update role по SID; `remove` — удалить
            переданные SID-ы.
      required: [hosts, mode]

    Choir:
      type: object
      description: |
        Choir — именованная топология хостов ВНУТРИ инкарнации (declared-«партия
        хора», ADR-044). Источник правды — таблица `incarnation_choirs`, НЕ
        `incarnation.state`.
      properties:
        incarnation_name:
          type: string
        choir_name:
          type: string
          pattern: '^[a-z][a-z0-9_-]*$'
        description:
          type: string
          nullable: true
        min_size:
          type: integer
          nullable: true
          description: Опциональный нижний лимит размера партии (> 0).
        max_size:
          type: integer
          nullable: true
          description: Опциональный верхний лимит размера партии (≥ min_size).
        created_at:
          type: string
          format: date-time
        created_by_aid:
          type: string
          nullable: true
          description: AID Архонта-создателя (из JWT-контекста; NULL после ревокации FK).
      required: [incarnation_name, choir_name, description, min_size, max_size, created_at, created_by_aid]

    Voice:
      type: object
      description: |
        Voice — членство SID в Choir-е (ADR-044). PK — тройка
        (incarnation_name, choir_name, sid); один SID легально является Voice в
        Choir-ах разных инкарнаций.
      properties:
        incarnation_name:
          type: string
        choir_name:
          type: string
        sid:
          type: string
        role:
          type: string
          nullable: true
          description: Поглощённая declared-роль (kebab-case или null, ADR-044).
        position:
          type: integer
          nullable: true
          description: Порядковый индекс внутри партии (≥ 0 или null).
        added_at:
          type: string
          format: date-time
        added_by_aid:
          type: string
          nullable: true
          description: AID Архонта, добавившего Voice (из JWT-контекста).
      required: [incarnation_name, choir_name, sid, role, position, added_at, added_by_aid]

    ChoirCreateRequest:
      type: object
      description: |
        Body POST /v1/incarnations/{name}/choirs. `created_by_aid` НЕ принимается
        из тела — берётся из JWT-контекста.
      properties:
        choir_name:
          type: string
          pattern: '^[a-z][a-z0-9_-]*$'
        description:
          type: string
          nullable: true
        min_size:
          type: integer
          nullable: true
        max_size:
          type: integer
          nullable: true
      required: [choir_name]

    VoiceAddRequest:
      type: object
      description: |
        Body POST /v1/incarnations/{name}/choirs/{choir}/voices. `added_by_aid`
        НЕ принимается из тела — берётся из JWT-контекста.
      properties:
        sid:
          type: string
        role:
          type: string
          nullable: true
          description: Опциональная declared-роль (kebab-case, 1..63 символа).
        position:
          type: integer
          nullable: true
          description: Опциональный порядковый индекс (≥ 0).
      required: [sid]

    ChoirListReply:
      type: object
      description: Список Choir-ов инкарнации (ADR-044).
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Choir'
        offset:
          type: integer
        limit:
          type: integer
        total:
          type: integer
      required: [items, offset, limit, total]

    VoiceListReply:
      type: object
      description: Список Voice-ов Choir-а (ADR-044).
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Voice'
        offset:
          type: integer
        limit:
          type: integer
        total:
          type: integer
      required: [items, offset, limit, total]

    IncarnationCheckDriftRequest:
      type: object
      description: |
        Body POST /v1/incarnations/{name}/check-drift. Все поля опциональны:
        input override converge-параметров (перекрывает auto-from-state по
        конвенции имени). Пустое тело допустимо — drift-проверка идёт только по
        incarnation.state.
      properties:
        input:
          type: object
          additionalProperties: true
          description: |
            Override converge-параметров. Имена/типы совпадают со схемой
            input: в scenario/converge/main.yml сервиса.

    DriftReport:
      type: object
      description: |
        Финальный отчёт Scry-проверки drift (ADR-031 Slice B). Содержит per-host
        агрегаты + summary. incarnation.status переводится handler-ом в `drift`
        post-check, если есть hosts_drifted/hosts_failed > 0 (информационно, НЕ
        блокирует remediation — ADR-031(d)).
      properties:
        checked_at:
          type: string
          format: date-time
        incarnation:
          type: string
        scenario_ref:
          type: string
          description: Имя сценария Scry — `converge`.
        hosts:
          type: array
          items:
            $ref: '#/components/schemas/DriftHostReport'
        summary:
          $ref: '#/components/schemas/DriftSummary'
      required: [checked_at, incarnation, scenario_ref, hosts, summary]

    DriftHostReport:
      type: object
      properties:
        sid:
          type: string
        status:
          type: string
          enum: [clean, drifted, unsupported, failed]
          description: |
            clean — все task-ы хоста вернули changed=false;
            drifted — хотя бы один task changed=true;
            unsupported — хотя бы один community-модуль без PlanReadSafe-
            capability (default-deny, ADR-031); failed — реальная ошибка Plan.
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/DriftTaskResult'
      required: [sid, status, tasks]

    DriftTaskResult:
      type: object
      properties:
        idx:
          type: integer
          minimum: 0
          description: task_idx из scenario.tasks[] после include-expand.
        module:
          type: string
          description: '`<namespace>.<module>.<state>` из RenderedTask.Module.'
        action:
          type: string
          description: Имя задачи (RenderedTask.Name), пустое если name не задан.
        changed:
          type: boolean
          description: true → drift на этом task-е.
        message:
          type: string
          description: |
            Operator-facing описание (пустое для clean). Заполняется только для
            failed/unsupported из error_summary первой упавшей задачи.
      required: [idx, module, changed]

    DriftSummary:
      type: object
      properties:
        hosts_drifted:
          type: integer
          minimum: 0
        hosts_clean:
          type: integer
          minimum: 0
        hosts_unsupported:
          type: integer
          minimum: 0
        hosts_failed:
          type: integer
          minimum: 0
      required: [hosts_drifted, hosts_clean, hosts_unsupported, hosts_failed]

    SoulCreateRequest:
      type: object
      properties:
        sid:
          type: string
          description: SID нового хоста = FQDN (docs/soul/identity.md).
        transport:
          $ref: '#/components/schemas/SoulTransport'
        covens:
          type: array
          items:
            type: string
            pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
            maxLength: 63
          description: |
            Стабильные Coven-метки хоста (ADR-008): kebab-case, привязываются
            при онбординге. Default []. Дальнейшие изменения набора — через
            scenario-шаг core.soul.registered (append/replace/remove).
      required: [sid, transport]

    SoulCreateReply:
      type: object
      description: |
        SENSITIVE: поле bootstrap_token отдаётся один раз (только для
        transport: agent); secret-masking middleware вырезает его из
        логов/OTel-spans/audit-trail.
      properties:
        sid:
          type: string
        transport:
          $ref: '#/components/schemas/SoulTransport'
        covens:
          type: array
          items:
            type: string
        status:
          $ref: '#/components/schemas/SoulStatus'
        registered_at:
          type: string
          format: date-time
        created_by_aid:
          type: string
          pattern: '^[a-z0-9][a-z0-9._@-]{1,127}$'
          description: AID Архонта, выполнившего запрос (из JWT.sub).
        bootstrap_token:
          type: string
          description: |
            SENSITIVE: never log. Plain bootstrap-токен, присутствует только
            для transport: agent. Возвращается один раз — повторный выпуск
            через POST /v1/souls/{sid}/issue-token.
        expires_at:
          type: string
          format: date-time
          description: Срок истечения bootstrap-токена (вместе с bootstrap_token).
      required: [sid, transport, status, registered_at, created_by_aid]

    SoulIssueTokenReply:
      type: object
      description: |
        SENSITIVE: поле bootstrap_token отдаётся один раз; masking-правила
        те же, что для SoulCreateReply.bootstrap_token.
      properties:
        sid:
          type: string
        bootstrap_token:
          type: string
          description: |
            SENSITIVE: never log. Новый plain bootstrap-токен, TTL по умолчанию.
        expires_at:
          type: string
          format: date-time
      required: [sid, bootstrap_token, expires_at]

    SoulSshTarget:
      type: object
      description: |
        Per-host SSH-реквизиты push-flow (ADR-032 amendment 2026-05-26 S7-1 +
        amendment 2026-05-27 P2 W-1). Хранится в souls.ssh_target jsonb;
        читается PGFallbackTargetResolver перед SshDispatcher.SendApply.
      properties:
        ssh_port:
          type: integer
          minimum: 1
          maximum: 65535
          description: TCP-порт SSH-сервера на хосте.
        ssh_user:
          type: string
          minLength: 1
          description: SSH-пользователь, под которым Keeper открывает сессию.
        soul_path:
          type: string
          pattern: '^/.+'
          description: |
            Абсолютный путь к soul-бинарю на хосте (соул-агент уже установлен
            до push-а либо доставляется Deliverer-ом с sha256-кешем).
        ssh_provider:
          type: string
          pattern: '^[a-z][a-z0-9-]{0,62}$'
          description: |
            Optional per-SID explicit SshProvider plugin name (P2 W-1
            multi-provider routing, Level 1). Когда задано — побеждает над
            coven_default / cluster_default. Пусто / отсутствует → routing
            идёт через push.coven_default_providers / push.cluster_default_provider.
      required: [ssh_port, ssh_user, soul_path]

    SoulSshTargetRequest:
      $ref: '#/components/schemas/SoulSshTarget'

    SoulSshTargetReply:
      type: object
      description: Snapshot сохранённой ssh_target-записи после PUT.
      properties:
        sid:
          type: string
        ssh_target:
          $ref: '#/components/schemas/SoulSshTarget'
      required: [sid, ssh_target]

    PushProvider:
      type: object
      description: |
        Запись реестра push_providers (ADR-032 amendment 2026-05-26, S7-2).
        Per-provider env-payload params SSH-плагина push-flow; key params —
        opaque-форма самого плагина (vault_addr/role/proxy_addr/…). Sensitive
        ключи (secret_id/token/password/private_key) обязаны быть vault-refs.
      properties:
        name:
          type: string
          pattern: '^[a-z][a-z0-9-]{0,62}$'
          description: Имя плагина (= plugins.ssh_providers[].name).
        params:
          type: object
          description: Opaque params; sensitive — vault-refs.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_by_aid:
          type: string
        updated_by_aid:
          type: string
          nullable: true
      required: [name, params, created_at, updated_at, created_by_aid]

    PushProviderCreateRequest:
      type: object
      properties:
        name:
          type: string
          pattern: '^[a-z][a-z0-9-]{0,62}$'
        params:
          type: object
      required: [name]

    PushProviderUpdateRequest:
      type: object
      properties:
        params:
          type: object
      required: [params]

    PushProviderListReply:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PushProvider'
        offset:
          type: integer
        limit:
          type: integer
        total:
          type: integer
      required: [items, offset, limit, total]

    SoulListReply:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SoulListEntry'
        offset:
          type: integer
          format: int32
        limit:
          type: integer
          format: int32
        total:
          type: integer
          format: int32
      required: [items, offset, limit, total]

    SoulListEntry:
      type: object
      description: Проекция реестра souls (docs/keeper/storage.md, docs/soul/identity.md).
      properties:
        sid:
          type: string
          description: SID = FQDN хоста.
        transport:
          $ref: '#/components/schemas/SoulTransport'
        status:
          $ref: '#/components/schemas/SoulStatus'
        covens:
          type: array
          items:
            type: string
          description: Coven-метки хоста (стабильные теги, ADR-008).
        last_seen_at:
          type: string
          format: date-time
        last_seen_by_kid:
          type: string
          description: KID Keeper-инстанса, видевшего последний контакт.
        registered_at:
          type: string
          format: date-time
      required: [sid, transport, status, registered_at]

    SoulprintReadReply:
      type: object
      description: |
        `GET /v1/souls/{sid}/soulprint`: проекция `souls.{soulprint_facts,
        soulprint_collected_at, soulprint_received_at}` — последний полученный
        typed-SoulprintReport (ADR-018). Ключи внутри typed_facts — proto field
        names (snake_case, `pkg_mgr`/`init_system`), форма по
        proto SoulprintFacts.
      properties:
        sid:
          type: string
        typed_facts:
          $ref: '#/components/schemas/SoulprintFacts'
        collected_at:
          type: string
          format: date-time
          description: Soul-side timestamp момента сбора фактов.
        received_at:
          type: string
          format: date-time
          description: Keeper-side timestamp приёма стрима.
      required: [sid, typed_facts]

    SoulHistoryReply:
      type: object
      description: |
        `GET /v1/souls/{sid}/history`: per-host operation timeline (scenario
        apply_runs + ad-hoc errands), merge started_at DESC. Конверт паритетен
        paged-list (items/offset/limit/total) + top-level `sid` (echo хоста).
      properties:
        sid:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/SoulHistoryItem'
        offset:
          type: integer
        limit:
          type: integer
        total:
          type: integer
      required: [sid, items, offset, limit, total]

    SoulHistoryItem:
      type: object
      description: |
        Одна запись per-host timeline. type-дискриминатор источника; поля,
        специфичные для одного источника, опускаются для другого
        (incarnation/scenario — scenario; module — errand).
      properties:
        type:
          type: string
          enum: [scenario, errand]
        id:
          type: string
          description: apply_id (scenario) | errand_id (errand).
        incarnation:
          type: string
          description: scenario-only — инкарнация прогона.
        scenario:
          type: string
          description: scenario-only — имя scenario.
        module:
          type: string
          description: errand-only — fully-qualified модуль exec-а.
        status:
          type: string
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          description: Опускается, пока запись не терминальна.
        voyage_id:
          type: string
          description: >
            Back-link на Voyage (ADR-043); опускается для не-Voyage / standalone /
            исторических прогонов.
      required: [type, id, status, started_at]

    SoulprintFacts:
      type: object
      description: |
        Typed-факты Soulprint (ADR-018, docs/soul/soulprint.md). Соответствует
        proto-сообщению `SoulprintFacts` (proto/keeper/v1/soulprint.proto).
        Все вложенные поля собираются Soul-агентом; пост-MVP-расширения
        (uptime/timezone/virtualization/cloud_provider/disks/bios) — additional
        field-номера в proto, additionalProperties для wire-compat.
      properties:
        sid:
          type: string
          description: Echo SID для логов; authority — mTLS peer cert.
        hostname:
          type: string
          description: Короткое имя хоста, `uname -n`.
        os:
          $ref: '#/components/schemas/SoulprintOsFacts'
        kernel:
          $ref: '#/components/schemas/SoulprintKernelFacts'
        cpu:
          $ref: '#/components/schemas/SoulprintCpuFacts'
        memory:
          $ref: '#/components/schemas/SoulprintMemoryFacts'
        network:
          $ref: '#/components/schemas/SoulprintNetworkFacts'

    SoulprintOsFacts:
      type: object
      description: Факты об операционной системе (ADR-018).
      properties:
        family:
          type: string
          description: debian / rhel / alpine / windows / darwin.
        distro:
          type: string
        version:
          type: string
        codename:
          type: string
        arch:
          type: string
          description: amd64 / arm64.
        pkg_mgr:
          type: string
          description: apt / dnf / apk / pacman.
        init_system:
          type: string
          description: systemd / openrc / sysv / launchd.

    SoulprintKernelFacts:
      type: object
      properties:
        version:
          type: string
          description: Полная версия с dist-suffix (5.15.0-101-generic).
        release:
          type: string
          description: Только версия ядра (5.15.0).

    SoulprintCpuFacts:
      type: object
      properties:
        count:
          type: integer
          format: int32
          description: Количество logical CPUs (с учётом HT/SMT).
        model:
          type: string
        vendor:
          type: string

    SoulprintMemoryFacts:
      type: object
      description: Объёмы памяти в МБ.
      properties:
        total_mb:
          type: integer
          format: int64
        available_mb:
          type: integer
          format: int64
        swap_mb:
          type: integer
          format: int64

    SoulprintNetworkFacts:
      type: object
      properties:
        primary_ip:
          type: string
          description: Основной IPv4 (интерфейс с default-route).
        fqdn:
          type: string
        interfaces:
          type: array
          items:
            $ref: '#/components/schemas/SoulprintNetworkInterface'

    SoulprintNetworkInterface:
      type: object
      properties:
        name:
          type: string
        ipv4:
          type: array
          items:
            type: string
          description: IPv4-адреса в CIDR (10.0.0.1/24).
        ipv6:
          type: array
          items:
            type: string
        mac:
          type: string
        mtu:
          type: integer
          format: int32

    SoulCovenAssignRequest:
      type: object
      description: |
        Bulk coven-assign: одна метка за вызов (append/remove) или набор
        целиком (replace). XOR-форма: append/remove → label, replace → labels.
      properties:
        mode:
          type: string
          enum: [append, remove, replace]
          description: |
            append — добавить метку; remove — снять; replace — заменить набор
            Coven-меток хоста целиком.
        label:
          type: string
          pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
          maxLength: 63
          description: |
            Назначаемая/снимаемая Coven-метка для append/remove (kebab-case,
            ADR-008). Запрещён для mode=replace (используйте labels).
        labels:
          type: array
          items:
            type: string
            pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
            maxLength: 63
          description: |
            Набор Coven-меток для mode=replace (может быть пустым = «снять
            все»). КАЖДАЯ метка обязана быть в coven-scope оператора.
            Запрещён для mode=append/remove (используйте label).
        selector:
          $ref: '#/components/schemas/SoulCovenAssignSelector'
        dry_run:
          type: boolean
          default: false
          description: |
            true — посчитать matched под selector ∩ scope без UPDATE.
            Объединяется по OR с query-параметром ?dry_run.
      required: [mode, selector]

    SoulCovenAssignSelector:
      type: object
      description: |
        Подмножество словаря таргетинга soul.* (all/sids/coven/incarnation/
        status). CEL-предикат сознательно не поддержан (доказуемость
        scope-проверки). Должен задавать хотя бы один критерий (all=true или
        sids/coven/incarnation/status). Комбинации критериев соединяются AND.
      properties:
        all:
          type: boolean
          default: false
          description: Без host-фильтра (весь реестр ∩ scope оператора).
        sids:
          type: array
          items:
            type: string
          description: Точечный список хостов (SID = FQDN).
        coven:
          type: string
          pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
          maxLength: 63
          description: Хосты, у которых уже есть эта Coven-метка.
        incarnation:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
          maxLength: 63
          description: |
            Хосты этой incarnation. Имя incarnation — корневая Coven-метка
            (ADR-008); матчинг через `name = ANY(coven)`.
        status:
          $ref: '#/components/schemas/SoulStatus'
          description: Фильтр по статусу.

    SoulCovenAssignReply:
      type: object
      properties:
        mode:
          type: string
          enum: [append, remove, replace]
        label:
          type: string
          description: Применённая метка для append/remove (зеркало input).
        labels:
          type: array
          items:
            type: string
          description: Применённый набор меток для replace (зеркало input).
        matched:
          type: integer
          format: int32
          description: Сколько хостов попало под selector ∩ scope.
        changed:
          type: integer
          format: int32
          description: Сколько строк фактически изменено (идемпотентный отсев не считается).
        status:
          type: string
          enum: [completed, partial]
          description: |
            completed — все чанки закоммичены (или dry_run); partial — фейл
            середины, 1..K-1 чанков зафиксированы (безопасно до-повторяется).
        dry_run:
          type: boolean
      required: [mode, label, matched, changed, status, dry_run]

    PushApplyRequest:
      type: object
      properties:
        inventory:
          type: array
          items:
            type: string
          description: |
            Список SID (FQDN) target-хостов. Хосты должны существовать
            в реестре souls с transport: ssh.
        destiny:
          type: string
          description: |
            Ссылка на Destiny в форме "<name>@<ref>" — name из
            default_destiny_source + git-tag/branch.
        input:
          type: object
          additionalProperties: true
          description: Input для destiny.
        ssh_provider:
          type: string
          description: |
            Имя SshProvider из keeper.yml plugins.ssh_providers[].name.
            По умолчанию — первый зарегистрированный.
        cleanup_stale_versions:
          type: boolean
          default: false
          description: |
            Удалить устаревшие версии soul-бинаря/модулей в той же SSH-сессии.
      required: [inventory, destiny]

    PushApplyReply:
      type: object
      properties:
        apply_id:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
      required: [apply_id]

    PushRunListReply:
      type: object
      description: |
        Страница push-прогонов (UI-4 Push-runs page). Возвращается
        GET /v1/push-runs. Compact-форма entry: вырезаны тяжёлые поля
        `input` и `summary.hosts[]`, остались агрегированные `summary_counts`.
        Полная запись с per-host исходами — через GET /v1/push/{apply_id}.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PushRunListEntry'
        offset:
          type: integer
        limit:
          type: integer
        total:
          type: integer
      required: [items, offset, limit, total]

    PushRunListEntry:
      type: object
      description: |
        Compact-форма строки push_runs для list-эндпоинта. summary редуцирован
        до агрегированных counts (`summary_counts`); полный массив hosts[]
        живёт только в detail-эндпоинте GET /v1/push/{apply_id}.
      properties:
        apply_id:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        inventory_sids:
          type: array
          items:
            type: string
        destiny_ref:
          type: string
          description: '<name>@<ref> запроса.'
        ssh_provider:
          type: string
        cleanup_stale:
          type: boolean
        status:
          type: string
          enum: [pending, running, success, partial_failed, failed, cancelled]
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          description: Отсутствует пока статус pending/running.
        started_by_aid:
          type: string
          pattern: '^[a-z0-9][a-z0-9._@-]{1,127}$'
        summary_counts:
          $ref: '#/components/schemas/PushSummaryCounts'
      required: [apply_id, inventory_sids, destiny_ref, cleanup_stale, status, started_at]

    PushSummaryCounts:
      type: object
      description: |
        Агрегированные counts из push_runs.summary jsonb. Все поля опциональны
        (omitempty): pending/running прогоны не имеют summary; для терминальных
        статусов orchestrator (pushorch.summarize) пишет всю тройку.
      properties:
        total:
          type: integer
        success_count:
          type: integer
        fail_count:
          type: integer

    PushApplyView:
      type: object
      description: |
        Состояние push-прогона (Variant C orchestrator, docs/keeper/push.md).
        Возвращается GET /v1/push/{apply_id}.
      properties:
        apply_id:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        inventory_sids:
          type: array
          items:
            type: string
        destiny_ref:
          type: string
          description: '<name>@<ref> запроса.'
        ssh_provider:
          type: string
        input:
          type: object
          additionalProperties: true
        cleanup_stale:
          type: boolean
        status:
          type: string
          enum: [pending, running, success, partial_failed, failed, cancelled]
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          description: Отсутствует пока статус pending/running.
        started_by_aid:
          type: string
          pattern: '^[a-z0-9][a-z0-9._@-]{1,127}$'
        summary:
          type: object
          additionalProperties: true
          description: |
            Per-host исходы прогона (присутствует для терминальных статусов).
            Форма: {hosts: [{sid, status, error?}], total, success_count, fail_count}.
            Для cancelled (Reaper orphan-purge) — дополнительно orphan_purged: true + reason.
      required: [apply_id, inventory_sids, destiny_ref, cleanup_stale, status, started_at]

    ErrandRunRequest:
      type: object
      description: |
        POST /v1/souls/{sid}/exec body (ADR-033). Содержит fully-qualified
        имя модуля, input + опц. timeout/dry_run. input проходит
        input-validation (input_schema модуля) и CEL-render-фазу
        (templating.md) на Keeper-side ДО отправки Soul-у.
      properties:
        module:
          type: string
          description: |
            Fully-qualified `<ns>.<name>.<state>`. Допускаются только
            `core.cmd.shell` / `core.exec.run` либо модули, реализующие
            ErrandReadSafe (default-deny на Soul-side).
        input:
          type: object
          additionalProperties: true
          description: Input для модуля (валидируется против input_schema).
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 300
          default: 30
          description: |
            Полный timeout Errand-а. Server-cap для sync-ответа — 30s
            (если timeout > 30s и Errand не завершился за 30s, handler
            отдаёт 202 + Location, выполнение продолжается).
        dry_run:
          type: boolean
          default: false
          description: |
            true — только для модулей с PlanReadSafe; для verb-модулей
            (shell/exec) → 400 errand_dry_run_unsupported (slice E3).
      required: [module]

    ErrandAccepted:
      type: object
      description: |
        202-body при async-эскалации `POST /v1/souls/{sid}/exec` либо при
        `GET /v1/errands/{errand_id}` пока строка ещё running.
      properties:
        errand_id:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        status:
          type: string
          enum: [running]
      required: [errand_id, status]

    ErrandResult:
      type: object
      description: |
        Финальное состояние Errand-а (ADR-033). Симметрично push_runs JSON-
        форме, но БЕЗ state_changes/inventory: Errand single-host, не
        мутирует incarnation.state. stdout/stderr cap-нуты до 64 KiB и
        маскированы общим secret-masking на keeper-side write-path-е.
      properties:
        errand_id:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        sid:
          type: string
        module:
          type: string
        status:
          type: string
          enum: [running, success, failed, timed_out, cancelled, module_not_allowed]
        exit_code:
          type: integer
          format: int32
          description: Для shell/exec; null для read-safe-модулей без exit-кода.
        stdout:
          type: string
          description: Captured stdout (cap 64 KiB, маскированный). Опционально.
        stderr:
          type: string
          description: Captured stderr (cap 64 KiB, маскированный). Опционально.
        stdout_truncated:
          type: boolean
          description: true — stdout превысил cap, обрезан.
        stderr_truncated:
          type: boolean
          description: true — stderr превысил cap, обрезан.
        duration_ms:
          type: integer
          format: int64
          description: Длительность Errand-а на Soul-side.
        error_message:
          type: string
          description: |
            Маскированная причина для failed/timed_out/module_not_allowed.
            Для success — пусто.
        output:
          type: object
          additionalProperties: true
          description: |
            Структурный output read-safe-модулей. Для shell/exec — null.
        started_by_aid:
          type: string
          pattern: '^[a-z0-9][a-z0-9._@-]{1,127}$'
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          description: Отсутствует пока status=running.
      required: [errand_id, sid, module, status, started_by_aid, started_at]

    ErrandListReply:
      type: object
      description: |
        GET /v1/errands paged-list. items — ErrandResult[] (включая running);
        offset/limit/total — стандартная сквозная пагинация.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ErrandResult'
        offset:
          type: integer
        limit:
          type: integer
        total:
          type: integer
      required: [items, offset, limit, total]

    VoyageTarget:
      type: object
      description: |
        Declarative target Voyage (резолвится в snapshot единиц). scenario-режим
        читает incarnations[]/service/coven; command-режим — sids[]/coven/where.
      properties:
        incarnations:
          type: array
          items:
            type: string
          description: scenario — exact-match имена инкарнаций.
        service:
          type: string
          description: scenario — фильтр incarnation.service (exact).
        sids:
          type: array
          items:
            type: string
          description: command — exact-match SID-снапшот.
        where:
          type: string
          description: command — CEL-предикат (MVP сохраняется, не evaluate-ится).
        coven:
          type: array
          items:
            type: string
          description: scenario — env-тег incarnation (any-of) / command — coven-метка хоста (AND).

    VoyageCreateRequest:
      type: object
      description: Body POST /v1/voyages (ADR-043 §4/§6).
      properties:
        kind:
          type: string
          enum: [scenario, command]
        scenario_name:
          type: string
          description: Обязательно для kind=scenario; запрещено для command.
        module:
          type: string
          description: Обязательно для kind=command; запрещено для scenario.
        input:
          type: object
          additionalProperties: true
          description: Параметры прогона (НЕ логируются в audit, инвариант A ADR-027).
        target:
          $ref: '#/components/schemas/VoyageTarget'
        batch_size:
          type: integer
          minimum: 1
          description: Размер Leg (число единиц в батче). null/опущен — весь прогон один Leg.
        concurrency:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
          description: Степень параллелизма внутри Leg.
        dry_run:
          type: boolean
          default: false
        schedule_at:
          type: string
          format: date-time
          description: Отложенный старт (status=scheduled, S4).
        inter_batch_interval_ms:
          type: integer
          minimum: 0
          description: Пауза между Leg-ами в миллисекундах (контролируемая выкатка).
        on_failure:
          type: string
          enum: [abort, continue]
          default: continue
      required: [kind, target]

    VoyageCreateReply:
      type: object
      properties:
        voyage_id:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        kind:
          type: string
          enum: [scenario, command]
        scope_size:
          type: integer
          description: Число резолвнутых единиц (инкарнаций / хостов).
        status:
          type: string
          enum: [pending, scheduled]
        location:
          type: string
      required: [voyage_id, kind, scope_size, status, location]

    VoyageSummary:
      type: object
      properties:
        total:
          type: integer
        succeeded:
          type: integer
        failed:
          type: integer
        cancelled:
          type: integer
        no_match:
          type: integer
      required: [total, succeeded, failed, cancelled]

    Voyage:
      type: object
      description: Snapshot Voyage-прогона (GET detail / list item).
      properties:
        voyage_id:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        kind:
          type: string
          enum: [scenario, command]
        scenario_name:
          type: string
        module:
          type: string
        status:
          type: string
          enum: [scheduled, pending, running, succeeded, failed, partial_failed, cancelled]
        scope_size:
          type: integer
        batch_size:
          type: integer
        concurrency:
          type: integer
        dry_run:
          type: boolean
        total_batches:
          type: integer
        current_batch_index:
          type: integer
        on_failure:
          type: string
          enum: [abort, continue]
        target:
          $ref: '#/components/schemas/VoyageTarget'
        schedule_at:
          type: string
          format: date-time
        attempt:
          type: integer
        started_by_aid:
          type: string
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        summary:
          $ref: '#/components/schemas/VoyageSummary'
      required: [voyage_id, kind, status, scope_size, total_batches, current_batch_index, dry_run, attempt, started_by_aid, created_at]

    VoyageListReply:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Voyage'
        offset:
          type: integer
        limit:
          type: integer
        total:
          type: integer
      required: [items, offset, limit, total]

    VoyageTargetEntry:
      type: object
      description: Одна строка voyage_targets (All-runs drill).
      properties:
        target_kind:
          type: string
          enum: [incarnation, sid]
        target_id:
          type: string
        batch_index:
          type: integer
        status:
          type: string
          enum: [awaiting, running, succeeded, failed, cancelled, no_match]
        apply_id:
          type: string
          description: back-link на apply_runs (kind=scenario).
        errand_id:
          type: string
          description: back-link на errands (kind=command).
        finished_at:
          type: string
          format: date-time
      required: [target_kind, target_id, batch_index, status]

    VoyageTargetsReply:
      type: object
      properties:
        voyage_id:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        targets:
          type: array
          items:
            $ref: '#/components/schemas/VoyageTargetEntry'
      required: [voyage_id, targets]

    VoyageCancelReply:
      type: object
      properties:
        voyage_id:
          type: string
        status:
          type: string
          enum: [cancelled]
      required: [voyage_id, status]

    PushCleanupRequest:
      type: object
      properties:
        inventory:
          type: array
          items:
            type: string
          description: Список SID (FQDN) target-хостов.
        ssh_provider:
          type: string
        full:
          type: boolean
          default: false
          description: |
            true — стереть /var/lib/soul-stack/ целиком (для revoke);
            false (default) — только устаревшие версии.
      required: [inventory]

    PushCleanupReply:
      type: object
      properties:
        apply_id:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
      required: [apply_id]

    ProviderCreateRequest:
      type: object
      properties:
        name:
          type: string
          description: Имя Provider (kebab-case), уникальное в кластере.
        type:
          type: string
          description: |
            Имя CloudDriver-плагина (aws/yc/…) из
            keeper.yml plugins.cloud_drivers[].name.
        region:
          type: string
          description: Регион/zone провайдера.
        credentials_ref:
          type: string
          pattern: '^vault:.+$'
          description: |
            Vault-ref до credentials (формат "vault:<path>"). Сам secret
            в БД не пишется. SENSITIVE: secret-masking middleware заменяет
            значение на "vault:***" в логах.
      required: [name, type, region, credentials_ref]

    ProviderCreateReply:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        region:
          type: string
        credentials_ref:
          type: string
        created_at:
          type: string
          format: date-time
        created_by_aid:
          type: string
          pattern: '^[a-z0-9][a-z0-9._@-]{1,127}$'
      required: [name, type, region, credentials_ref, created_at, created_by_aid]

    ProfileCreateRequest:
      type: object
      properties:
        name:
          type: string
          description: Имя Profile (kebab-case).
        provider:
          type: string
          description: Имя зарегистрированного Provider.
        params:
          type: object
          additionalProperties: true
          description: |
            Параметры VM, валидируются против profile_schema CloudDriver-плагина.
        cloud_init:
          type: string
          description: Сырая cloud-init userdata (optional).
      required: [name, provider, params]

    ProfileCreateReply:
      type: object
      properties:
        name:
          type: string
        provider:
          type: string
        params:
          type: object
          additionalProperties: true
        cloud_init:
          type: string
        created_at:
          type: string
          format: date-time
        created_by_aid:
          type: string
          pattern: '^[a-z0-9][a-z0-9._@-]{1,127}$'
      required: [name, provider, params, created_at, created_by_aid]
