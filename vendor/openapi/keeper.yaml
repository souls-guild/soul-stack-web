openapi: 3.1.0
info:
  title: Soul Stack Operator API
  version: 1.0.0
  description: |
    HTTP-фасад Keeper-а для операторов (Архонтов). Каждый endpoint жёстко
    привязан 1:1 к permission и MCP-tool. Источник правды по semantics —
    docs/keeper/operator-api.md, по message-форме — proto/operator/v1/.

    Conventions:
      - URL prefix /v1/ для permission-проверяемых endpoint-ов;
        health/meta — вне /v1/.
      - Auth: Authorization: Bearer <JWT> (ADR-014). Bootstrap первого
        Архонта — administrative subcommand keeper init, не HTTP.
      - JSON field naming: snake_case (UseProtoNames).
      - Enum serialization: короткие формы без family-prefix
        (INCARNATION_STATUS_READY → "ready").
      - Errors: application/problem+json (RFC 7807).
      - Time: ISO-8601 / RFC 3339 в UTC.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: https://{keeper}
    description: |
      Operator API listener. Адрес — listen.openapi.addr из keeper.yml.
      Permission-проверяемые endpoints — под /v1/ (path-keys в этом документе
      уже содержат префикс). Health/meta endpoints (/healthz, /readyz,
      /openapi.yaml) — корневые, без префикса /v1. Prometheus /metrics — на
      отдельном listener-е (listen.metrics.addr), не часть этого API.
    variables:
      keeper:
        default: keeper.internal:8080
        description: KID + listen.openapi.addr из keeper.yml.

security:
  - bearerAuth: []

tags:
  - name: Health
    description: Health/meta endpoints (вне /v1/, без auth).
  - name: Operator
    description: Управление Архонтами (ADR-013, ADR-014).
  - name: Role
    description: RBAC — роли, permissions и состав операторов (ADR-022).
  - name: Incarnation
    description: Жизненный цикл runtime-инстансов сервисов (ADR-009).
  - name: Soul
    description: Реестр Souls.
  - name: Plugin
    description: Sigil — allow-list целостности плагинов (ADR-026).
  - name: Sigil
    description: Ротация trust-anchor-ключей подписи Sigil (ADR-026(h), R3).
  - name: Service
    description: Реестр Service-ов service_registry (ADR-028-паттерн RBAC-storage).
  - name: Module
    description: Каталог модулей (core registry + активные plugin) для UI Run→Command module-search.
  - name: Permission
    description: Машиночитаемый каталог RBAC-permissions (источник — rbac.catalog.go) для UI назначения прав роли.
  - name: Augur
    description: Реестры Augur — Omen (внешняя система) и Rite (grant) (ADR-025, augur.md).
  - name: Oracle
    description: Реестры Oracle — Vigil (Soul-side проверка) и Decree (правило reactor) (ADR-030, beacons).
  - name: Push
    description: Push-режим SSH-доставки Destiny (docs/keeper/push.md).
  - name: Cloud
    description: Cloud-провайдеры — Provider и Profile (docs/keeper/cloud.md).
  - name: Choir
    description: Топология хостов внутри инкарнации — Choir (партия) и Voice (членство SID) (ADR-044).

paths:
  /healthz:
    get:
      tags: [Health]
      operationId: GetHealthz
      summary: Liveness probe.
      description: Процесс жив. Не проверяет внешние зависимости.
      security: []
      responses:
        '200':
          description: Процесс жив.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /readyz:
    get:
      tags: [Health]
      operationId: GetReadyz
      summary: Readiness probe.
      description: Postgres + Vault достижимы. Возвращает 503 при not-ready.
      security: []
      responses:
        '200':
          description: Все зависимости доступны.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: Какая-либо зависимость недоступна.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'

  /openapi.yaml:
    get:
      tags: [Health]
      operationId: GetOpenapiSpec
      summary: Self-served OpenAPI 3.1 spec.
      description: |
        Hand-written спека этого API (RFC 9512 application/yaml).
        Embed-копия docs/keeper/openapi.yaml внутри keeper-бинаря.
      security: []
      responses:
        '200':
          description: OpenAPI 3.1 spec.
          content:
            application/yaml:
              schema:
                type: string

  /v1/operators:
    post:
      tags: [Operator]
      operationId: CreateOperator
      summary: Создать Архонта.
      description: |
        Permission: operator.create. MCP-tool: keeper.operator.create.
        Создаёт запись в реестре operators, выпускает первый JWT
        (TTL = auth.jwt.ttl_default). JWT возвращается один раз.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperatorCreateRequest'
      responses:
        '201':
          description: Архонт создан, JWT выпущен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorCreateReply'
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '409': { $ref: '#/components/responses/Problem409' }
        '422': { $ref: '#/components/responses/Problem422' }
        '500': { $ref: '#/components/responses/Problem500' }
    get:
      tags: [Operator]
      operationId: ListOperators
      summary: Список Архонтов (paged + фильтры).
      description: |
        Permission: operator.list. Read-only, без audit.
        Фильтры (опционально): auth_method (jwt/mtls/combined), revoked
        (bool, default false — только активные). Пагинация — стандартная.
      parameters:
        - in: query
          name: auth_method
          required: false
          schema:
            type: string
            enum: [jwt, mtls, combined]
          description: Фильтр по форме credential.
        - in: query
          name: revoked
          required: false
          schema:
            type: boolean
            default: false
          description: |
            false — только активные (revoked_at IS NULL). true — включая
            ревокнутых. Default = false (UI-friendly).
        - $ref: '#/components/parameters/OffsetQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Лента Архонтов под фильтром.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorListReply'
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '422': { $ref: '#/components/responses/Problem422' }
        '500': { $ref: '#/components/responses/Problem500' }

  /v1/operators/{aid}:
    get:
      tags: [Operator]
      operationId: GetOperator
      summary: Detail Архонта.
      description: |
        Permission: operator.list (одна permission покрывает list+get в MVP,
        паттерн service.list / soul.list). Read-only, без audit.
      parameters:
        - $ref: '#/components/parameters/AidPath'
      responses:
        '200':
          description: Archon найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operator'
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '422': { $ref: '#/components/responses/Problem422' }
        '500': { $ref: '#/components/responses/Problem500' }

  /v1/audit:
    get:
      tags: [Audit]
      operationId: ListAuditEvents
      summary: Лента audit-events (paged + фильтры).
      description: |
        Permission: audit.read. Read-only — без audit-trail (чтение audit_log
        НЕ пишется в audit_log, чтобы не было рекурсии).
        Фильтры (все опциональны): type (multi-value OR), source (multi-value
        OR), archon_aid (exact), correlation_id (exact), started_after /
        started_before (RFC3339, обе границы включающие). Пагинация —
        стандартная (offset/limit).
      parameters:
        - in: query
          name: type
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: |
            Multi-value `?type=X&type=Y`. Exact-match OR (event_type IN (X,Y)).
        - in: query
          name: source
          required: false
          schema:
            type: array
            items:
              type: string
              enum: [signal, api, mcp, keeper_internal, soul_grpc, background]
          style: form
          explode: true
          description: Multi-value `?source=api&source=mcp`. Exact-match OR.
        - in: query
          name: archon_aid
          required: false
          schema:
            type: string
            pattern: '^[a-z0-9][a-z0-9._@-]{1,127}$'
          description: AID Архонта-инициатора (exact match).
        - in: query
          name: correlation_id
          required: false
          schema:
            type: string
          description: ULID цепочки связанных событий (exact match).
        - in: query
          name: started_after
          required: false
          schema:
            type: string
            format: date-time
          description: created_at >= started_after (RFC3339, включающая).
        - in: query
          name: started_before
          required: false
          schema:
            type: string
            format: date-time
          description: created_at <= started_before (RFC3339, включающая).
        - $ref: '#/components/parameters/OffsetQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Лента audit-events под фильтром.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventListReply'
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '422': { $ref: '#/components/responses/Problem422' }
        '500': { $ref: '#/components/responses/Problem500' }

  /v1/operators/{aid}/revoke:
    post:
      tags: [Operator]
      operationId: RevokeOperator
      summary: Отозвать Архонта.
      description: |
        Permission: operator.revoke. MCP-tool: keeper.operator.revoke.
        Ставит operators.revoked_at = now(). Активные JWT работают до exp.
        409 would-lock-out-cluster — нельзя отозвать последнего Архонта
        с *-permission.
      parameters:
        - $ref: '#/components/parameters/AidPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperatorRevokeRequest'
      responses:
        '204':
          description: Архонт отозван.
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409': { $ref: '#/components/responses/Problem409' }
        '500': { $ref: '#/components/responses/Problem500' }

  /v1/operators/{aid}/issue-token:
    post:
      tags: [Operator]
      operationId: IssueOperatorToken
      summary: Выпустить новый JWT для Архонта.
      description: |
        Permission: operator.issue-token. MCP-tool: keeper.operator.issue-token.
        Старые JWT остаются валидными до exp. Новый JWT возвращается один раз.
      parameters:
        - $ref: '#/components/parameters/AidPath'
      responses:
        '200':
          description: JWT выпущен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueTokenReply'
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '500': { $ref: '#/components/responses/Problem500' }

  /v1/roles:
    post:
      tags: [Role]
      operationId: CreateRole
      summary: Создать роль.
      description: |
        Permission: role.create. MCP-tool: keeper.role.create.
        Создаёт роль с набором permissions (replace-семантики нет — это
        создание). 409 role-already-exists — name уже занят.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleCreateRequest'
      responses:
        '201':
          description: Роль создана.
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '409': { $ref: '#/components/responses/Problem409' }
        '422': { $ref: '#/components/responses/Problem422' }
        '500': { $ref: '#/components/responses/Problem500' }
    get:
      tags: [Role]
      operationId: ListRoles
      summary: Список ролей.
      description: |
        Permission: role.list. MCP-tool: keeper.role.list.
        Каталог ролей с их permissions и составом операторов (membership).
      responses:
        '200':
          description: Каталог ролей.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleListReply'
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '500': { $ref: '#/components/responses/Problem500' }

  /v1/roles/{name}:
    delete:
      tags: [Role]
      operationId: DeleteRole
      summary: Удалить роль.
      description: |
        Permission: role.delete. MCP-tool: keeper.role.delete.
        Каскадом сносятся permissions роли и membership. 409 role-builtin —
        builtin-роль удалять нельзя; 409 would-lock-out-cluster — удаление
        снимет последнего `*`-админа.
      parameters:
        - $ref: '#/components/parameters/RoleNamePath'
      responses:
        '204':
          description: Роль удалена.
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409': { $ref: '#/components/responses/Problem409' }
        '500': { $ref: '#/components/responses/Problem500' }

  /v1/roles/{name}/permissions:
    patch:
      tags: [Role]
      operationId: UpdateRolePermissions
      summary: Заменить набор permissions роли.
      description: |
        Permission: role.update. MCP-tool: keeper.role.update.
        Replace-семантика: переданный набор полностью заменяет существующий.
        409 role-builtin — builtin-роль редактировать нельзя;
        409 would-lock-out-cluster — снятие `*` оставит кластер без админа.
      parameters:
        - $ref: '#/components/parameters/RoleNamePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RolePermissionsUpdateRequest'
      responses:
        '204':
          description: Набор permissions заменён.
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409': { $ref: '#/components/responses/Problem409' }
        '422': { $ref: '#/components/responses/Problem422' }
        '500': { $ref: '#/components/responses/Problem500' }

  /v1/roles/{name}/operators:
    post:
      tags: [Role]
      operationId: GrantRoleOperator
      summary: Назначить оператора в роль.
      description: |
        Permission: role.grant-operator. MCP-tool: keeper.role.grant-operator.
        Идемпотентно: повторный grant той же пары (role, aid) — no-op.
        404 not-found — целевой AID не существует в реестре операторов.
      parameters:
        - $ref: '#/components/parameters/RoleNamePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantOperatorRequest'
      responses:
        '204':
          description: Оператор назначен в роль.
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '422': { $ref: '#/components/responses/Problem422' }
        '500': { $ref: '#/components/responses/Problem500' }

  /v1/roles/{name}/operators/{aid}:
    delete:
      tags: [Role]
      operationId: RevokeRoleOperator
      summary: Снять оператора с роли.
      description: |
        Permission: role.revoke-operator. MCP-tool: keeper.role.revoke-operator.
        404 not-found — пары (role, aid) нет; 409 would-lock-out-cluster —
        снятие оставит кластер без `*`-админа.
      parameters:
        - $ref: '#/components/parameters/RoleNamePath'
        - $ref: '#/components/parameters/AidPath'
      responses:
        '204':
          description: Оператор снят с роли.
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409': { $ref: '#/components/responses/Problem409' }
        '422': { $ref: '#/components/responses/Problem422' }
        '500': { $ref: '#/components/responses/Problem500' }

  /v1/incarnations:
    post:
      tags: [Incarnation]
      operationId: CreateIncarnation
      summary: Создать incarnation.
      description: |
        Permission: incarnation.create. MCP-tool: keeper.incarnation.create.
        Запускает scenario create указанного сервиса (async).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncarnationCreateRequest'
      responses:
        '202':
          description: Запуск принят. apply_id для опроса статуса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncarnationCreateReply'
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '409': { $ref: '#/components/responses/Problem409' }
        '422': { $ref: '#/components/responses/Problem422' }
        '500': { $ref: '#/components/responses/Problem500' }
    get:
      tags: [Incarnation]
      operationId: ListIncarnations
      summary: Список incarnation-ов.
      description: |
        Permission: incarnation.list. MCP-tool: keeper.incarnation.list.
      parameters:
        - $ref: '#/components/parameters/OffsetQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - name: service
          in: query
          required: false
          schema:
            type: string
          description: Фильтр по имени сервиса.
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/IncarnationStatus'
          description: Фильтр по статусу.
        - name: coven
          in: query
          required: false
          schema:
            type: string
            pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
          description: |
            Фильтр по declared env-тегу incarnation (exact-match по any-of
            в `incarnation.covens[]`, ADR-008 amendment a). Multi-value (OR) —
            пост-MVP (`?coven_any=`).
      responses:
        '200':
          description: Страница списка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncarnationListReply'
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '500': { $ref: '#/components/responses/Problem500' }

  /v1/incarnations/{name}:
    get:
      tags: [Incarnation]
      operationId: GetIncarnation
      summary: Прочитать spec + state + status incarnation-а.
      description: |
        Permission: incarnation.get. MCP-tool: keeper.incarnation.get.
      parameters:
        - $ref: '#/components/parameters/IncarnationNamePath'
      responses:
        '200':
          description: Состояние incarnation-а.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncarnationGetReply'
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '500': { $ref: '#/components/responses/Problem500' }
    delete:
      tags: [Incarnation]
      operationId: DestroyIncarnation
      summary: Удалить incarnation.
      description: |
        Permission: incarnation.destroy. MCP-tool: keeper.incarnation.destroy.
        Async-операция. Operator-facing allow_destroy маппится в internal
        force (decisions.md → force↔allow_destroy). false — штатный destroy
        через teardown-scenario `destroy`; true — снос без teardown (DELETE
        строки напрямую, escape-hatch для incarnation без внешних ресурсов,
        warning в audit).
      parameters:
        - $ref: '#/components/parameters/IncarnationNamePath'
        - name: allow_destroy
          in: query
          required: true
          schema:
            type: boolean
          description: |
            Confirmation flag (обязателен; отсутствует/не-boolean → 400).
            false — destroy через teardown scenario `destroy` (нет scenario в
            снапшоте сервиса → 422); true — снос без teardown (force, DELETE
            строки напрямую). Маппится в internal force. Симметрия с MCP-tool
            keeper.incarnation.destroy.
      responses:
        '202':
          description: Запуск destroy принят.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncarnationDestroyReply'
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409': { $ref: '#/components/responses/Problem409' }
        '422': { $ref: '#/components/responses/Problem422' }
        '500': { $ref: '#/components/responses/Problem500' }

  /v1/incarnations/{name}/scenarios/{scenario}:
    post:
      tags: [Incarnation]
      operationId: RunIncarnationScenario
      summary: Запустить scenario против incarnation.
      description: |
        Permission: incarnation.run. MCP-tool: keeper.incarnation.run.
        Async-операция, 202 + `apply_id` (`IncarnationRunReply`).
      parameters:
        - $ref: '#/components/parameters/IncarnationNamePath'
        - name: scenario
          in: path
          required: true
          schema:
            type: string
          description: Имя сценария из scenario/<scenario>/.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncarnationRunRequest'
      responses:
        '202':
