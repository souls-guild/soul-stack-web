  /v1/souls:
    post:
      tags: [Soul]
      operationId: CreateSoul
      summary: Зарегистрировать Soul.
      description: |
        Permission: soul.create. MCP-tool: keeper.soul.create.
        Создаёт запись в реестре souls (status: pending). Для transport: agent
        выпускает первый bootstrap-токен (одноразовый, plain-токен один раз);
        для transport: ssh токен не выпускается. Полная семантика —
        docs/soul/onboarding.md.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SoulCreateRequest'
      responses:
        '201':
          description: Soul зарегистрирована; для agent — bootstrap-токен выпущен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoulCreateReply'
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '409': { $ref: '#/components/responses/Problem409' }
        '422': { $ref: '#/components/responses/Problem422' }
        '500': { $ref: '#/components/responses/Problem500' }
    get:
      tags: [Soul]
      operationId: ListSouls
      summary: Список Souls.
      description: |
        Permission: soul.list. MCP-tool: keeper.soul.list.
        Single-Soul read (GET /v1/souls/{sid}) и soulprint-read
        (GET /v1/souls/{sid}/soulprint) покрываются тем же permission
        `soul.list` (паттерн service.list / omen.list / vigil.list /
        decree.list — одно permission на чтение реестра; `soul.get`
        сознательно отложен, rbac.md §Souls).
      parameters:
        - $ref: '#/components/parameters/OffsetQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - name: coven
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: |
            Фильтр по coven-меткам (exact-match по любому значению из
            souls.coven[]). Несколько значений — повторение query-параметра.
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/SoulStatus'
