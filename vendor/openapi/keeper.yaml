  /v1/incarnations/{name}/hosts:
    patch:
      tags: [Incarnation]
      operationId: UpdateIncarnationHosts
      summary: Править declared `spec.hosts[]` (UI Hosts editing, ADR-008).
      description: |
        Permission: incarnation.update. MCP-tool: keeper.incarnation.hosts.update.

        Три mode-семантики над declared `spec.hosts[]`:
          - `replace` — полная замена списка переданным набором (включая пустой).
          - `append`  — добавить переданные hosts; при совпадении SID role
                        существующей записи обновляется (insert-or-update).
          - `remove`  — удалить записи с указанными SID-ами (`role` в payload
                        игнорируется).

        SID-ы валидируются на существование в реестре `souls` (single batch-
        SELECT, не per-host); неизвестные SID → 422. `role` — опциональна,
        формат `^[a-z][a-z0-9]*(-[a-z0-9]+)*$` (kebab-case, 1..63 символа) или
        пустая (ADR-008 допускает null для хостов вне declared-spec).
        Атомарность — одна PG-транзакция SELECT FOR UPDATE → guard статуса →
        souls-validate → UPDATE spec.

        Статус `destroying` / `destroy_failed` → 409 (правка spec бессмысленна
        при сносе); остальные статусы (включая `applying`) — допустимы (spec —
        declared-вход следующего прогона, не текущего).

        Audit `incarnation.hosts_updated` (`source: api`/`mcp`, archon = JWT.sub).
      parameters:
        - $ref: '#/components/parameters/IncarnationNamePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncarnationUpdateHostsRequest'
      responses:
        '200':
          description: Обновлённый incarnation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncarnationGetReply'
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409': { $ref: '#/components/responses/Problem409' }
        '422': { $ref: '#/components/responses/Problem422' }
        '500': { $ref: '#/components/responses/Problem500' }

