        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '410':
          description: Soulprint не приходил (запись Soul-а есть, фактов нет).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422': { $ref: '#/components/responses/Problem422' }
        '500': { $ref: '#/components/responses/Problem500' }

  /v1/souls/{sid}/history:
    get:
      tags: [Soul]
      operationId: GetSoulHistory
      summary: Per-host operation timeline (scenario + errand).
      description: |
        Permission: soul.list (тот же read-permission, что GET /v1/souls/{sid}
        и /soulprint; отдельная `soul.history` не вводится — паттерн
        one-permission-per-read, rbac.md §Souls). Селектор `host=<sid>`.
        Агрегирует per-host строки двух источников в единый timeline,
        отсортированный started_at DESC:
          - scenario — `apply_runs` (scenario-задача, доехавшая до хоста в
            рамках scenario-прогона инкарнации);
          - errand — `errands` (ad-hoc pull-exec одиночного модуля, ADR-033).
        push_runs пока НЕ включён (per-host данные там в jsonb summary —
        follow-up).
      parameters:
        - $ref: '#/components/parameters/SidPath'
        - name: type
          in: query
          required: false
          explode: true
          schema:
            type: array
            items:
              type: string
              enum: [scenario, errand]
          description: |
            Фильтр по источнику (multi-value OR, ?type=scenario&type=errand).
            Пусто — оба источника.
        - name: since
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: RFC3339; вернуть только записи с started_at > value.
        - $ref: '#/components/parameters/OffsetQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Per-host timeline (paged, started_at DESC).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoulHistoryReply'
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '422': { $ref: '#/components/responses/Problem422' }
        '500': { $ref: '#/components/responses/Problem500' }

  /v1/souls/{sid}/issue-token:
    post:
      tags: [Soul]
      operationId: IssueSoulToken
      summary: Перевыпустить bootstrap-токен Soul.
      description: |
        Permission: soul.issue-token. MCP-tool: keeper.soul.issue-token.
        Перевыпуск bootstrap-токена для существующей Soul (transport: agent).
        Инвариант UNIQUE (sid) WHERE used_at IS NULL — максимум один активный
        токен. Без force при активном токене → 409 bootstrap-token-active;
        force=true истекает старый и выпускает новый. Для transport: ssh →
        422 validation-failed. Plain-токен один раз.
      parameters:
        - $ref: '#/components/parameters/SidPath'
        - name: force
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: |
            true — истечь активный токен и выпустить новый. При false и
            наличии активного токена → 409 bootstrap-token-active.
      responses:
        '200':
          description: Новый bootstrap-токен выпущен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoulIssueTokenReply'
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409': { $ref: '#/components/responses/Problem409' }
        '422': { $ref: '#/components/responses/Problem422' }
        '500': { $ref: '#/components/responses/Problem500' }

  /v1/souls/{sid}/ssh-target:
    put:
      tags: [Soul]
      operationId: UpdateSoulSshTarget
      summary: Обновить per-host SSH-реквизиты push-flow.
      description: |
        ADR-032 amendment 2026-05-26 (S7-1): souls.ssh_target jsonb — canonical
        источник per-host SSH-реквизитов push-flow. keeper.yml::push.targets[]
        — legacy fallback под флагом push.allow_legacy_push_targets (1-release
        WARN deprecation window).

        Permission: soul.ssh-target-update; selector host=<sid>. MCP-tool:
        keeper.soul.ssh-target.update (3-сегментное имя, паттерн
        keeper.sigil.key.<verb> ↔ permission sigil.key-<verb>). Body несёт
        полный набор полей; partial-update не поддерживается (write-NULL для
        снятия target-а — отдельный DELETE-роут, не S7-1).
      parameters:
        - $ref: '#/components/parameters/SidPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SoulSshTargetRequest'
      responses:
        '200':
          description: Snapshot сохранённой записи ssh_target.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoulSshTargetReply'
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '422': { $ref: '#/components/responses/Problem422' }
        '500': { $ref: '#/components/responses/Problem500' }

  /v1/souls/{sid}/exec:
    post:
      tags: [Errand]
      operationId: ErrandExec
      summary: Запустить Errand на Soul (pull-ad-hoc exec одиночного модуля).
      description: |
        Permission: errand.run; selector host=<sid>. ADR-033.
        Sync-первичный flow с server-cap 30s: 200 + ErrandResult если терминал
        получен до cap; иначе 202 + {errand_id} + Location: /v1/errands/{errand_id},
        продолжение в background-горутине до полного timeout_seconds (max 300s).
        Errand НЕ мутирует incarnation.state. Whitelist модулей: жёсткий список
        core.cmd.shell / core.exec.run, либо marker-интерфейс ErrandReadSafe в
        sdk/module/. Проверка на Soul-side (defense-in-depth) → MODULE_NOT_ALLOWED.
      parameters:
        - $ref: '#/components/parameters/SidPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrandRunRequest'
      responses:
        '200':
          description: Errand завершился синхронно (терминал получен до server-cap).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrandResult'
        '202':
          description: |
            Async-эскалация: server-cap 30s превышен, Errand продолжает выполняться.
            Location-header — URL для polling-а. Финальный результат — GET /v1/errands/{errand_id}.
          headers:
            Location:
              schema:
                type: string
              description: URL для polling-а финального результата.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrandAccepted'
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '422': { $ref: '#/components/responses/Problem422' }
        '500': { $ref: '#/components/responses/Problem500' }

  /v1/errands:
    get:
      tags: [Errand]
      operationId: ListErrands
      summary: Список Errand-ов (фильтр + пагинация).
      description: |
        Permission: errand.list. Read-only, без audit.
        Фильтры (опционально): sid (FQDN), status, started_after (RFC3339).
        Пагинация — стандартная (offset/limit). Per-row RBAC-фильтрация по
        host=/coven= — slice E5 (сейчас bare-permission).
      parameters:
        - in: query
          name: sid
          required: false
          schema:
            type: string
          description: FQDN целевого Soul.
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [running, success, failed, timed_out, cancelled, module_not_allowed]
          description: Терминальный или running статус.
        - in: query
          name: started_after
          required: false
          schema:
            type: string
            format: date-time
          description: Фильтр по началу (started_at > value).
        - in: query
          name: module
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: |
            Multi-value `?module=X&module=Y`. Exact-match OR (module IN (X,Y));
            regex/glob не поддерживается (ТЗ UI iter 2).
        - in: query
          name: offset
          required: false
          schema:
            type: integer
            minimum: 0
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: Список Errand-ов под фильтром.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrandListReply'
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '422': { $ref: '#/components/responses/Problem422' }
        '500': { $ref: '#/components/responses/Problem500' }

  /v1/errands/{errand_id}:
    get:
      tags: [Errand]
      operationId: GetErrand
      summary: Состояние одного Errand-а.
      description: |
        Permission: errand.list. Read-only. 200 + ErrandResult — терминал;
        202 + {status:"running"} — Errand ещё выполняется (async-poll).
      parameters:
        - in: path
          name: errand_id
          required: true
          schema:
            type: string
            pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
          description: ULID Errand-а.
      responses:
        '200':
          description: Терминальное состояние Errand-а.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrandResult'
        '202':
          description: Errand ещё running, повторите запрос позже.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrandAccepted'
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '422': { $ref: '#/components/responses/Problem422' }
        '500': { $ref: '#/components/responses/Problem500' }
    delete:
      tags: [Errand]
      operationId: CancelErrand
      summary: Отменить in-flight Errand (slice E5, ADR-033).
      description: |
        Permission: errand.cancel. Best-effort: Keeper отправляет CancelErrand
        Soul-у через EventStream-канал, Soul-side errandrunner отменяет ctx
        активной Run-горутины → возвращает ErrandResult{CANCELLED} тем же
        каналом, Keeper переводит строку errands в status=cancelled через
        applybus-receiver. 204 — сигнал отправлен (финальный статус видно
        через GET /v1/errands/{errand_id}). 409 — Errand уже в терминальном
        статусе (нечего отменять). 404 — errand_id не найден ИЛИ целевой
        Soul не подключён к кластеру (cancel-сигнал не доставлен; строка
        останется running до Reaper timed_out).
      parameters:
        - in: path
          name: errand_id
          required: true
          schema:
            type: string
            pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
          description: ULID Errand-а.
      responses:
        '204':
          description: Cancel-сигнал отправлен Soul-у. Финальный статус — GET /v1/errands/{errand_id}.
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409': { $ref: '#/components/responses/Problem409' }
        '422': { $ref: '#/components/responses/Problem422' }
        '500': { $ref: '#/components/responses/Problem500' }

  /v1/voyages:
    post:
      tags: [Voyage]
      operationId: CreateVoyage
      summary: Создать Voyage — унифицированный батчевый прогон (ADR-043).
      description: |
        Унифицированный батчевый прогон (kind=scenario / kind=command).
        Дискриминатор `kind`:
        - `scenario` — применить named scenario к набору ИНКАРНАЦИЙ (батч = N
          инкарнаций, per-incarnation state-commit, B1). Target резолвится в
          имена инкарнаций (incarnations[] ∪ фильтр service/coven).
        - `command` — выполнить whitelisted-модуль на наборе ХОСТОВ (батч = N
          хостов, state не трогается). Target резолвится в SID-snapshot (AND-merge
          sids/coven/where, security invariant ADR-040 → ADR-043 §5).

        RBAC-by-kind (ADR-043 §6, security-критичный fail-closed guard):
        scenario→permission `incarnation.run`, command→`errand.run`. Permission
        выбирается ПО kind из тела + per-incarnation scope-check (scenario);
        старт на цели вне permission-скоупа = privilege escalation → 403.

        Batch (Leg) = N единиц (batch_size); между Leg-ами — inter_batch_interval;
        on_failure ∈ {abort, continue}. schedule_at → отложенный старт (status
        scheduled). Async-by-default: 202 + voyage_id + Location. Пустой
        резолв-target → 422 voyage_empty_target. `input` НЕ логируется (audit
        scenario_run.started/command_run.invoked, инвариант A ADR-027).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoyageCreateRequest'
      responses:
        '202':
          description: Voyage создан (pending/scheduled). VoyageWorker подберёт через claim-loop.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoyageCreateReply'
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '422': { $ref: '#/components/responses/Problem422' }
        '500': { $ref: '#/components/responses/Problem500' }
    get:
      tags: [Voyage]
      operationId: ListVoyages
      summary: Список Voyage-прогонов (фильтр kind/status + пагинация).
      description: |
        Permission: incarnation.history. Sort created_at DESC.
      parameters:
        - in: query
          name: kind
          required: false
          schema:
            type: string
            enum: [scenario, command]
          description: Exact-match по kind.
        - in: query
          name: status
          required: false
          schema:
            type: array
            items:
              type: string
              enum: [scheduled, pending, running, succeeded, failed, partial_failed, cancelled]
          style: form
          explode: true
          description: Multi-value `?status=X&status=Y`; OR-семантика.
        - in: query
          name: offset
          required: false
          schema:
            type: integer
            minimum: 0
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
      responses:
        '200':
          description: Страница Voyage-прогонов под фильтром.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoyageListReply'
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '422': { $ref: '#/components/responses/Problem422' }
        '500': { $ref: '#/components/responses/Problem500' }

  /v1/voyages/{id}:
    get:
      tags: [Voyage]
      operationId: GetVoyage
      summary: Snapshot одного Voyage (detail + summary).
      description: |
        Permission: incarnation.history. Для running-row — current_batch_index
        без summary; для терминала — Summary с агрегатами.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
          description: ULID Voyage-а.
      responses:
        '200':
          description: Snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Voyage'
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '422': { $ref: '#/components/responses/Problem422' }
        '500': { $ref: '#/components/responses/Problem500' }
    delete:
      tags: [Voyage]
      operationId: CancelVoyage
      summary: Отменить Voyage (pending/scheduled → cancelled, ADR-043 S5).
      description: |
        RBAC-by-kind (как у create): scenario→incarnation.run, command→errand.run.
        Cancel pending/scheduled — простой перевод в cancelled. Running-abort —
        post-MVP (409 voyage_running_cancel_unsupported). Уже terminal — 409
        voyage_already_terminal. Audit: scenario_run.cancelled/command_run.cancelled.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
      responses:
        '202':
          description: Voyage отменён (pending/scheduled → cancelled).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoyageCancelReply'
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409': { $ref: '#/components/responses/Problem409' }
        '422': { $ref: '#/components/responses/Problem422' }
        '500': { $ref: '#/components/responses/Problem500' }

  /v1/voyages/{id}/targets:
    get:
      tags: [Voyage]
      operationId: ListVoyageTargets
      summary: All-runs drill — единицы Voyage-прогона (ADR-043 S5).
      description: |
        Permission: incarnation.history. Per-target (batch_index, status,
        back-link apply_id|errand_id) для two-level drill: scenario — инкарнации
        → их хосты (через apply_id); command — сразу хосты (через errand_id).
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
      responses:
        '200':
          description: Единицы прогона.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoyageTargetsReply'
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '422': { $ref: '#/components/responses/Problem422' }
        '500': { $ref: '#/components/responses/Problem500' }

  /v1/plugins/sigils:
    post:
      tags: [Plugin]
      operationId: AllowPluginSigil
      summary: Допустить плагин в allow-list Sigil.
      description: |
        Permission: plugin.allow. MCP-tool: keeper.plugin.allow (S4b).
        Допуск целостности плагина (ADR-026). Keeper читает ТЕКУЩИЙ бинарь +
        manifest из единственного слота кеша host-а по (namespace, name) —
        single-slot, ref в чтении НЕ участвует (вариант C), — подписывает блок
        Sigil-а и вставляет запись в реестр plugin_sigils. `ref` —
        operator-asserted метка версии (НЕ git-verified); authority целостности
        — sha256 + подпись Keeper-а. 404 plugin-not-in-cache — плагина нет в
        кеше; 409 sigil-already-active — активный допуск на (ns, name, ref) уже
        есть (сперва revoke).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PluginSigilAllowRequest'
      responses:
        '201':
          description: Плагин допущен; в теле sha256 одобренного бинаря.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginSigilAllowReply'
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409': { $ref: '#/components/responses/Problem409' }
        '422': { $ref: '#/components/responses/Problem422' }
        '500': { $ref: '#/components/responses/Problem500' }
    get:
      tags: [Plugin]
      operationId: ListPluginSigils
      summary: Список активных Sigil-допусков.
      description: |
        Permission: plugin.list. MCP-tool: keeper.plugin.list (S4b).
        Лента активных (не отозванных) записей allow-list-а plugin_sigils, новые
        первыми. БЕЗ signature и manifest (крипто-материал / крупный JSONB).
      responses:
        '200':
          description: Лента активных допусков.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginSigilListReply'
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '500': { $ref: '#/components/responses/Problem500' }

  /v1/plugins/sigils/{namespace}/{name}/{ref}:
    delete:
      tags: [Plugin]
      operationId: RevokePluginSigil
      summary: Отозвать Sigil-допуск.
      description: |
        Permission: plugin.revoke. MCP-tool: keeper.plugin.revoke (S4b).
        Мягкая ревокация активного допуска (ns, name, ref): запись остаётся в
        реестре для аудита, бинарь перестаёт проходить Sigil-верификацию. 404
        sigil-not-found — активной записи нет. `ref` — одиночный path-сегмент
        (tag-ref вида v1.2.3); branch-ref со слешем через path в MVP не
        поддерживается → 422.
      parameters:
        - $ref: '#/components/parameters/PluginNamespacePath'
        - $ref: '#/components/parameters/PluginNamePath'
        - $ref: '#/components/parameters/PluginRefPath'
      responses:
        '204':
          description: Допуск отозван.
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '422': { $ref: '#/components/responses/Problem422' }
        '500': { $ref: '#/components/responses/Problem500' }

  /v1/sigil/keys:
    post:
      tags: [Sigil]
      operationId: IntroduceSigilKey
      summary: Ввести новый ключ подписи Sigil.
      description: |
        Permission: sigil.key-introduce. MCP-tool: keeper.sigil.key.introduce
        (ADR-026(h), R3). Keeper генерирует ed25519-пару, пишет приватник в Vault
        KV и вставляет публичную часть (SPKI) в реестр sigil_signing_keys как
        active trust-anchor. Ответ несёт key_id + pubkey_pem — приватник НИКОГДА
        не возвращается (security-инвариант ADR-026(d)). make_primary=true делает
        ключ primary (новые Sigil-ы подписываются им). После ввода кластер
        re-load-ит набор якорей (`sigil:anchors-changed`). 409
        sigil-key-concurrent-change — гонка установки primary (retry).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SigilKeyIntroduceRequest'
      responses:
        '201':
          description: Ключ введён; в теле key_id + публичный ключ (без приватника).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigilKeyIntroduceReply'
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '409': { $ref: '#/components/responses/Problem409' }
        '500': { $ref: '#/components/responses/Problem500' }
    get:
      tags: [Sigil]
      operationId: ListSigilKeys
      summary: Список active ключей подписи Sigil.
      description: |
        Permission: sigil.key-list. MCP-tool: keeper.sigil.key.list (R3). Active
        trust-anchor-ключи подписи (primary первым). БЕЗ vault_ref (внутренняя
        ссылка на приватник).
      responses:
        '200':
          description: Лента active-ключей подписи.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigilKeyListReply'
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '500': { $ref: '#/components/responses/Problem500' }

  /v1/sigil/keys/{key_id}/primary:
    post:
      tags: [Sigil]
      operationId: SetPrimarySigilKey
      summary: Сделать ключ подписи primary.
      description: |
        Permission: sigil.key-set-primary. MCP-tool: keeper.sigil.key.set-primary
        (R3). Делает active-ключ primary — новые Sigil-ы подписываются им после
        cluster reload. 404 sigil-key-not-found — ключа нет; 409
        sigil-key-concurrent-change — гонка primary либо ключ retired.
      parameters:
        - $ref: '#/components/parameters/SigilKeyIDPath'
      responses:
        '204':
          description: Ключ стал primary.
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409': { $ref: '#/components/responses/Problem409' }
        '422': { $ref: '#/components/responses/Problem422' }
        '500': { $ref: '#/components/responses/Problem500' }

  /v1/sigil/keys/{key_id}:
    delete:
      tags: [Sigil]
      operationId: RetireSigilKey
      summary: Вывести ключ подписи из набора.
      description: |
        Permission: sigil.key-retire. MCP-tool: keeper.sigil.key.retire (R3).
        Выводит trust-anchor-ключ (Soul забывает его при следующем
        SigilTrustAnchors). 404 sigil-key-not-found — active-записи нет; 409
        sigil-key-last-active — последний active-ключ (набор не должен опустеть);
        409 sigil-key-primary — primary напрямую (сперва set-primary другому).
      parameters:
        - $ref: '#/components/parameters/SigilKeyIDPath'
      responses:
        '204':
          description: Ключ выведен.
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409': { $ref: '#/components/responses/Problem409' }
        '422': { $ref: '#/components/responses/Problem422' }
        '500': { $ref: '#/components/responses/Problem500' }

  /v1/services:
    post:
      tags: [Service]
      operationId: RegisterService
      summary: Зарегистрировать Service.
      description: |
        Permission: service.register. MCP-tool: keeper.service.register
        (ADR-028-паттерн RBAC-storage). Создаёт запись в реестре
        service_registry (git-источник + ref + опц. авто-refresh). 409
        service-already-exists — name занят; 404 not-found — AID создателя
        отсутствует в реестре operators (FK).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRegisterRequest'
      responses:
        '201':
          description: Service зарегистрирован.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceView'
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409': { $ref: '#/components/responses/Problem409' }
        '422': { $ref: '#/components/responses/Problem422' }
        '500': { $ref: '#/components/responses/Problem500' }
    get:
      tags: [Service]
      operationId: ListServices
      summary: Список Service-ов.
      description: |
        Permission: service.list. MCP-tool: keeper.service.list.
        Реестр зарегистрированных Service-ов (sort name ASC).
      responses:
        '200':
          description: Реестр Service-ов.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceListReply'
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '500': { $ref: '#/components/responses/Problem500' }

  /v1/services/{name}:
    get:
      tags: [Service]
      operationId: GetService
      summary: Получить Service.
      description: |
        Permission: service.list. MCP-tool: keeper.service.list (одно
        permission покрывает list и get). Читает одну запись реестра по имени.
        404 not-found — записи нет.
      parameters:
        - $ref: '#/components/parameters/ServiceNamePath'
      responses:
        '200':
          description: Запись Service-а.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceView'
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '500': { $ref: '#/components/responses/Problem500' }
    patch:
      tags: [Service]
      operationId: UpdateService
      summary: Обновить Service.
      description: |
        Permission: service.update. MCP-tool: keeper.service.update.
        Replace-семантика mutable-полей (git/ref/refresh); name — ключ, не
        меняется. 404 not-found — записи нет либо AID правщика отсутствует в
        operators (FK).
      parameters:
        - $ref: '#/components/parameters/ServiceNamePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceUpdateRequest'
      responses:
        '200':
          description: Service обновлён.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceView'
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '422': { $ref: '#/components/responses/Problem422' }
        '500': { $ref: '#/components/responses/Problem500' }
    delete:
      tags: [Service]
      operationId: DeregisterService
      summary: Удалить Service из реестра.
      description: |
        Permission: service.deregister. MCP-tool: keeper.service.deregister.
        Удаляет запись реестра по имени. 404 not-found — записи нет.
      parameters:
        - $ref: '#/components/parameters/ServiceNamePath'
      responses:
        '204':
          description: Service удалён из реестра.
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '500': { $ref: '#/components/responses/Problem500' }

  /v1/services/{name}/refs:
    get:
      tags: [Service]
      operationId: ListServiceRefs
      summary: Список git-tag-ов и branch-ей Service-а.
      description: |
        Permission: service.list. Возвращает доступные git-ref-ы remote-
        репозитория Service-а (tags + branches с commit-hash-ом и пометкой
        дефолтной ветки) для UI Upgrade-modal dropdown. Кеш на стороне Keeper-а
        — TTL 60s (per-Keeper, не cluster-wide). Tags сортируются semver desc
        (валидный semver выше lex; pre-release ниже release); branches —
        default first, остальные lex asc. Read-only, без audit. 502 bad-gateway
        — внешний git-источник не ответил (DNS / auth / неподдерживаемая схема).
      parameters:
        - $ref: '#/components/parameters/ServiceNamePath'
      responses:
        '200':
          description: Список ref-ов.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRefsListReply'
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '500': { $ref: '#/components/responses/Problem500' }
        '502': { $ref: '#/components/responses/Problem502' }

  /v1/services/{name}/scenarios:
    get:
      tags: [Service]
      operationId: ListServiceScenarios
      summary: Список scenario из git-репо Service-а.
      description: |
        Permission: service.list. Возвращает список scenario-метаданных из
        материализованного снапшота git-репо Service-а (`scenario/<name>/main.yml`)
        для UI Run-modal dropdown «Choose scenario». Параметр `?ref=<git-ref>`
        опционален: по умолчанию используется ref из реестра Service-а; UI может
        переопределить, чтобы посмотреть scenario конкретной версии до Upgrade.
        Сортировка alphabetical asc. Невалидный YAML / отсутствующий `main.yml`
        в одной из scenario-папок не ломает listing остальных (partial-success).
        Кеш на стороне Keeper-а — TTL 60s, ключ (name, ref). Read-only, без
        audit. 502 bad-gateway — loader упал (git-clone / парсинг манифеста).
      parameters:
        - $ref: '#/components/parameters/ServiceNamePath'
        - in: query
          name: ref
          required: false
          schema: { type: string }
          description: |
            git-ref для проверки. Если не задан — берётся ref из реестра
            Service-а.
      responses:
        '200':
          description: Список scenario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceScenariosListReply'
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '500': { $ref: '#/components/responses/Problem500' }
        '502': { $ref: '#/components/responses/Problem502' }

  /v1/services/{name}/state-schema:
    get:
      tags: [Service]
      operationId: ListServiceStateSchema
      summary: state_schema-метаданные сервиса (для UI Schema explorer-а).
      description: |
        Permission: service.list. Возвращает state_schema-метаданные сервиса
        из материализованного снапшота git-репо Service-а:
        `state_schema_version` (текущая версия структуры `incarnation.state`),
        опциональная декларация структуры (`service.yml::state_schema:`, MVP
        подмножество JSON Schema — type/required/properties/items/
        additionalProperties), и плоский список миграций
        `migrations/<NNN>_to_<MMM>.yml` (metadata-only: from/to/path; content
        DSL не парсится). Параметр `?ref=<git-ref>` опционален: по умолчанию
        используется ref из реестра Service-а. Сортировка миграций — by `to`
        ASC. Кеш на стороне Keeper-а — TTL 60s, ключ (name, ref). Read-only,
        без audit. 502 bad-gateway — loader упал (git-clone / парсинг
        манифеста / scan migrations).
      parameters:
        - $ref: '#/components/parameters/ServiceNamePath'
        - in: query
          name: ref
          required: false
          schema: { type: string }
          description: |
            git-ref для проверки. Если не задан — берётся ref из реестра
            Service-а.
      responses:
        '200':
          description: state_schema-метаданные.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceStateSchemaReply'
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '500': { $ref: '#/components/responses/Problem500' }
        '502': { $ref: '#/components/responses/Problem502' }

  /v1/services/{name}/dependencies:
    get:
      tags: [Service]
      operationId: ListServiceDependencies
      summary: git-зависимости сервиса (destiny + modules, для UI Service Detail).
      description: |
        Permission: service.list. Возвращает git-зависимости сервиса из
        материализованного снапшота git-репо Service-а: задекларированные в
        `service.yml` destiny-кирпичики (`destiny:`) и custom-модули
        (`modules:`), каждый со своим git-ref-ом (ADR-007: версия = git
        tag/branch). Поле `git` присутствует только при per-entry override
        полного URL (поддержан лишь для destiny[]). Content самих
        destiny/модулей НЕ грузится — только `{name, ref}`. Параметр
        `?ref=<git-ref>` опционален: по умолчанию используется ref из реестра
        Service-а. Кеш на стороне Keeper-а — TTL 60s, ключ (name, ref).
        Read-only, без audit. 502 bad-gateway — loader упал (git-clone /
        парсинг манифеста).
      parameters:
        - $ref: '#/components/parameters/ServiceNamePath'
        - in: query
          name: ref
          required: false
          schema: { type: string }
          description: |
            git-ref для проверки. Если не задан — берётся ref из реестра
            Service-а.
      responses:
        '200':
          description: git-зависимости сервиса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceDependenciesReply'
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '500': { $ref: '#/components/responses/Problem500' }
        '502': { $ref: '#/components/responses/Problem502' }

  /v1/modules:
    get:
      tags: [Module]
      operationId: ListModules
      summary: Каталог доступных модулей (core + активные plugin).
      description: |
        Permission: service.list. Каталог модулей для UI Run→Command module-
        search (замена free-text «custom module»). Два источника:
        core — статическая doc-таблица (имя/описание/state-ы/errand-safe; params
        пусты — input-схема core не формализована), plugin — активные (не
        отозванные) записи plugin_sigils с params из manifest `spec.states[*].
        input`. Выдача отсортирована по name. Read-only, без audit (паттерн
        service.list / plugin.list). Опц. фильтр `?errand_safe=true` — только
        модули с хотя бы одним errand-safe state (для Run→Command whitelist).
      parameters:
        - in: query
          name: errand_safe
          required: false
          schema: { type: boolean }
          description: |
            При `true` — только модули с хотя бы одним errand-safe state
            (core.cmd / core.exec / core.http + plugin-модули с marker-ом
            ErrandReadSafe, ADR-033).
      responses:
        '200':
          description: Каталог модулей.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleCatalogReply'
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '500': { $ref: '#/components/responses/Problem500' }

  /v1/modules/{name}:
    get:
      tags: [Module]
      operationId: GetModule
      summary: Деталь одного модуля по полному имени.
      description: |
        Permission: service.list. Возвращает запись каталога по полному имени
        без state-суффикса (`core.cmd` / `official.postgres-user`). 404 — модуля
        нет в каталоге (core-таблица или активные plugin-допуски). Read-only,
        без audit.
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
          description: Полное имя модуля без state-суффикса (`core.cmd`).
      responses:
        '200':
          description: Запись каталога.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleCatalogItem'
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '500': { $ref: '#/components/responses/Problem500' }

  /v1/modules/{name}/form-prep:
    post:
      tags:
        - Modules
      summary: Resolve UI-form source catalog to live SIDs (ADR-045 S3)
      description: >-
        Резолвер source-каталогов UI-формы модуля. По source
        (incarnation_hosts / choir) возвращает живые SID-ы для автокомплита
        поля формы. Cluster-wide (по реестру souls), prefix-фильтр + жёсткий
        cap (truncated=true при упоре в cap). Permission incarnation.run
        (подготовка прогона Run→Command).
      operationId: moduleFormPrep
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: Полное имя модуля без state-суффикса (per-module форма).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - source
              properties:
                source:
                  type: object
                  description: Ровно один из incarnation_hosts / choir.
                  properties:
                    incarnation_hosts:
                      type: string
                      description: Имя incarnation — live SID-ы её хостов.
                    choir:
                      type: object
                      required:
                        - incarnation
                        - name
                      properties:
                        incarnation:
                          type: string
                        name:
                          type: string
                prefix:
                  type: string
                  description: Префикс SID для автокомплита (LIKE prefix%).
      responses:
        "200":
          description: Резолвленные SID-ы (отсортированы, ≤ cap).
          content:
            application/json:
              schema:
                type: object
                required:
                  - sids
                  - truncated
                properties:
                  sids:
                    type: array
                    items:
                      type: string
                  truncated:
                    type: boolean
                    description: true → результат обрезан по cap, есть ещё.
        "400":
          description: Нечитаемое тело / неизвестные поля.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "422":
          description: source не задан / задан более одного / пустые координаты.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          description: Сбой резолва.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /v1/permissions:
    get:
      tags: [Permission]
      operationId: ListPermissions
      summary: Каталог RBAC-permissions (источник правды — rbac.catalog.go).
      description: |
        RBAC: только аутентификация (валидный JWT), БЕЗ отдельной permission —
        каталог самоописывающий (требование права на чтение списка прав даёт
        курицу-яйцо). Назначение — UI назначения прав роли (`PATCH /v1/roles/
        {name}/permissions`): UI фетчит реальные имена из каталога вместо
        хардкода. Сгруппировано по resource (сортировка по resource, внутри —
        по action). Read-only, без audit (паттерн health/meta).

        selector_keys — ОБЩИЙ список допустимых ключей скоупа (service / coven /
        incarnation / host): per-permission-метаданных скоупа в каталоге MVP нет.
      responses:
        '200':
          description: Каталог permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionCatalogReply'
        '401': { $ref: '#/components/responses/Problem401' }
        '500': { $ref: '#/components/responses/Problem500' }

  /v1/augur/omens:
    post:
      tags: [Augur]
      operationId: CreateOmen
      summary: Создать Omen.
      description: |
        Permission: omen.create. MCP-tool: keeper.augur.omen.create (ADR-025).
        Создаёт запись в реестре omens (внешняя система vault/prometheus/elk +
        endpoint + auth_ref — vault-ref на master-cred, не сам секрет). 409
        omen-already-exists — name занят; 422 validation-failed — битый
        name/source_type/endpoint/auth_ref.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OmenCreateRequest'
      responses:
        '201':
          description: Omen создан.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OmenView'
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '409': { $ref: '#/components/responses/Problem409' }
        '422': { $ref: '#/components/responses/Problem422' }
        '500': { $ref: '#/components/responses/Problem500' }
    get:
      tags: [Augur]
      operationId: ListOmens
      summary: Список Omen-ов.
      description: |
        Permission: omen.list. MCP-tool: keeper.augur.omen.list.
        Реестр Omen-ов (sort created_at DESC, name ASC; offset/limit).
      parameters:
        - $ref: '#/components/parameters/OffsetQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Страница Omen-ов.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OmenListReply'
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '500': { $ref: '#/components/responses/Problem500' }

  /v1/augur/omens/{name}:
    get:
