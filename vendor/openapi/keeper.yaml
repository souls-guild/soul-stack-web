    get:
      tags: [Push]
      operationId: ListPushRuns
      summary: Глобальный список push-прогонов (UI-4 Push-runs page).
      description: |
        Permission: incarnation.history (push — это history-info; permission
        переиспользуется; отдельная permission `push.list` не вводится до
        запроса оператора). Сортировка `started_at DESC` (свежие первыми).

