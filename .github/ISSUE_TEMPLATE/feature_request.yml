name: Feature request
description: Suggest an improvement or a new capability for the web UI
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Please describe the **problem** you're trying to solve, not
        only the solution you have in mind — it helps us find the best fit.

        The UI is a client of the Keeper Operator API. If your idea needs a backend
        change, the [core repository](https://github.com/souls-guild/soul-stack) is the
        right place — design decisions live in its
        [ADRs](https://github.com/souls-guild/soul-stack/tree/main/docs/adr).

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do, and what's getting in the way today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like the UI to do? A sketch or mock helps.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why they fall short.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the UI does this touch?
      options:
        - Run wizard
        - Registry (Services / Incarnations / Souls / Plugins)
        - Identity & RBAC (Archons / roles / tokens)
        - Runs & history (Tides / Errand runs / push runs)
        - Audit
        - i18n / accessibility
        - needs a backend change
        - not sure / several
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else — use case, links, prior art.
    validations:
      required: false
