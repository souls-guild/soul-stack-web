name: Bug report
description: Report a bug or unexpected behavior in the web UI
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Before filling it out, please check
        [known limitations](https://github.com/souls-guild/soul-stack/blob/main/docs/known-limitations.md)
        — some behavior is deliberately out of scope for the beta.

        **Do not report security vulnerabilities here.** Disclose them privately —
        see [SECURITY.md](https://github.com/souls-guild/soul-stack-web/blob/main/SECURITY.md).

  - type: input
    id: version
    attributes:
      label: UI version
      description: Release version or commit SHA of the UI build.
      placeholder: "v0.1.0-beta.3 (or commit abc1234)"
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      description: Where the bug shows up.
      options:
        - Chrome / Chromium
        - Firefox
        - Safari
        - Edge
        - other / several
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the UI.
      options:
        - Run wizard
        - Registry (Services / Incarnations / Souls / Providers / Plugins)
        - Identity & RBAC (Archons / roles / tokens)
        - Runs & history (Tides / Errand runs / push runs)
        - Audit
        - Login / auth
        - not sure / several
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal sequence that leads to the bug.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead. A screenshot helps a lot for a UI bug.
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Console / network
      description: >-
        Relevant browser console errors or a failing network request.
        DO NOT attach secrets — JWT tokens (the UI stores one in localStorage),
        Vault contents, private keys, DSNs with passwords. Mask anything sensitive.
      render: text
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser version, and the Keeper API version/URL the UI talks to (if relevant).
      placeholder: |
        OS: ...
        Browser version: ...
        Keeper API: ...
    validations:
      required: true
